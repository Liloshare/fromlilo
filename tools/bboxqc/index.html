<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBox QC</title>
  <style>
    :root {
      --bg: #f3f0fb;
      --panel: #ffffff;
      --text: #4a4560;
      --muted: #948fb3;
      --line: #e6e1f5;
      --soft: #f6f3fc;
      --ink: #55506e;
      --accent: #6b84dc;
      --accent-2: #4fa38c;
      --danger: #d1637d;
      --warn: #c98a3e;
      --ok: #4f9d6e;
      --dark: #2c2a3d;
      --dark-rgb: 44, 42, 61;
      --radius: 8px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
    }

    .app {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
    }

    header {
      background: #5d5a86;
      color: white;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }

    h1 {
      font-size: 18px;
      line-height: 1.2;
      margin: 0;
      font-weight: 800;
      letter-spacing: 0;
    }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 12px;
      color: rgba(255,255,255,0.78);
    }

    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 12px;
      padding: 12px;
      min-height: 0;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      min-height: 0;
      overflow: hidden;
    }

    .panel-head {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: #f9f6fd;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .panel-title {
      font-size: 13px;
      font-weight: 800;
    }

    .panel-body {
      padding: 14px;
      overflow: auto;
      max-height: calc(100vh - 70px);
    }

    .stack { display: grid; gap: 12px; }

    .field { display: grid; gap: 6px; }
    .field label {
      font-size: 12px;
      font-weight: 800;
      color: #55506e;
    }

    input[type="file"] { display: none; }

    .drop {
      border: 1px dashed #c3bcdb;
      background: #f8f5fc;
      border-radius: var(--radius);
      padding: 14px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .drop:hover { border-color: var(--accent); background: #eaeefb; }
    .drop.loaded { border-color: var(--ok); background: #eaf6ef; }
    .drop strong { display: block; font-size: 13px; margin-bottom: 4px; }
    .drop span { display: block; color: var(--muted); font-size: 12px; line-height: 1.35; }

    textarea, select, input[type="text"], input[type="number"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: white;
      color: var(--text);
      font: inherit;
      font-size: 13px;
      padding: 8px 10px;
    }
    textarea { min-height: 92px; resize: vertical; }

    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      min-height: 34px;
    }
    button:hover { background: #f8f5fc; }
    button.primary { background: var(--accent); color: white; border-color: var(--accent); }
    button.primary:hover { background: #5570c9; }
    button.success { background: var(--accent-2); color: white; border-color: var(--accent-2); }
    button.danger { background: #fbeef1; color: var(--danger); border-color: #eec4d0; }
    button:disabled { opacity: .45; cursor: not-allowed; }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .stat {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      background: var(--soft);
      text-align: left;
      min-height: 58px;
    }
    .stat.filterable { cursor: pointer; }
    .stat.filterable:hover,
    .stat.active {
      border-color: var(--accent);
      background: #e1e6fa;
      color: #5570c9;
    }
    .stat-separator {
      grid-column: 1 / -1;
      height: 1px;
      background: var(--line);
      margin: 2px 0;
    }
    .export-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .stat .num { font-size: 20px; font-weight: 900; line-height: 1; }
    .stat .label { color: var(--muted); font-size: 11px; margin-top: 4px; font-weight: 700; }
    .num.ok { color: var(--ok); }
    .num.warn { color: var(--warn); }
    .num.err { color: var(--danger); }

    .swatch { width: 18px; height: 18px; border-radius: 4px; border: 1px solid rgba(0,0,0,.15); }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(320px, 560px);
      gap: 8px;
      padding: 10px;
      border-bottom: 1px solid var(--line);
      background: #f9f6fd;
      align-items: center;
    }

    .class-chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      background: #f9f6fd;
    }
    .class-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: white;
      color: var(--ink);
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      min-height: 0;
    }
    .class-chip:hover { border-color: var(--accent); }
    .class-chip.active { background: #e1e6fa; border-color: var(--accent); color: #5570c9; }
    .class-chip .chip-swatch {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex: 0 0 auto;
    }


    .gallery-wrap {
      min-height: 0;
      overflow: auto;
      height: calc(100vh - 126px);
      padding: 12px;
    }

    .pager {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      font-size: 12px;
      color: var(--muted);
      font-weight: 800;
    }
    .pager-actions { display: flex; gap: 6px; align-items: center; }
    .pager-actions button { min-height: 28px; padding: 4px 9px; }
    .page-number.active { background: var(--accent); border-color: var(--accent); color: #050505; }
    .page-ellipsis { padding: 4px 2px; color: var(--muted); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
    }
    .gallery-empty {
      grid-column: 1 / -1;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      padding: 40px 0;
    }

    .thumb {
      border: 2px solid transparent;
      background: white;
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      position: relative;
      box-shadow: 0 1px 2px rgba(16,24,40,.06);
    }
    .thumb:hover { border-color: #aebdf0; }
    .thumb.dup { border-color: var(--warn); }
    .thumb.zero-box { border-color: var(--muted); }
    .thumb.active { border-color: var(--accent); }
    .thumb.reviewed { border-color: var(--ok); }
    .thumb.issue { border-color: var(--danger); }
    .thumb-order {
      position: absolute;
      top: 8px;
      left: 8px;
      max-width: calc(100% - 16px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      background: rgba(var(--dark-rgb),.72);
      color: white;
      font-size: 10px;
      font-weight: 900;
      padding: 3px 7px;
      border-radius: 4px;
      z-index: 2;
    }
    .thumb.reviewed::before {
      content: "✓";
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--ok);
      color: white;
      font-size: 10px;
      font-weight: 900;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      z-index: 2;
    }
    .thumb.issue::before {
      content: "!";
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--danger);
      color: white;
      font-size: 10px;
      font-weight: 900;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      z-index: 2;
    }
    .thumb canvas {
      width: 100%;
      aspect-ratio: 16 / 10;
      display: block;
      background: var(--dark);
    }
    .thumb-foot {
      padding: 8px;
      border-top: 1px solid var(--line);
      display: grid;
      gap: 4px;
    }
    .thumb-name {
      font-size: 11px;
      line-height: 1.25;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .thumb-meta {
      font-size: 11px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .viewer {
      display: grid;
      gap: 10px;
    }
    .viewer-main { min-width: 0; position: relative; }
    .viewer-side { display: grid; gap: 10px; align-content: start; }
    .canvas-frame {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: auto;
      background: var(--dark);
      max-height: 52vh;
      display: grid;
      place-items: safe center;
    }
    #mainCanvas {
      max-width: 100%;
      height: auto;
      display: block;
      cursor: zoom-in;
    }
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      min-height: 0;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.25);
      background: rgba(var(--dark-rgb),.55);
      color: #fff;
      font-size: 20px;
      font-weight: 900;
      display: grid;
      place-items: center;
      cursor: pointer;
      z-index: 3;
    }
    .nav-arrow:hover { background: rgba(107,132,220,.85); }
    .nav-arrow:disabled { opacity: .25; cursor: not-allowed; background: rgba(var(--dark-rgb),.55); }
    .nav-prev { left: 10px; }
    .nav-next { right: 10px; }
    .pos-counter {
      font-size: 12px;
      color: var(--muted);
      font-weight: 800;
      white-space: nowrap;
    }
    #mainViewToggleBtn.active { background: #e1e6fa; color: #5570c9; border-color: var(--accent); }

    .magnifier {
      position: fixed;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: 3px solid white;
      box-shadow: 0 4px 18px rgba(0,0,0,.45), 0 0 0 1px rgba(0,0,0,.15);
      pointer-events: none;
      overflow: hidden;
      z-index: 600;
      background: var(--dark);
    }
    .magnifier canvas { width: 100%; height: 100%; display: block; }

    #viewerPanel {
      display: none;
    }
    #viewerPanel.viewer-fullscreen {
      position: fixed;
      inset: 0;
      z-index: 200;
      border-radius: 0;
      display: flex;
      flex-direction: column;
    }
    .panel.viewer-fullscreen .panel-body {
      max-height: none;
      height: 100%;
      overflow: hidden;
      padding: 12px;
    }
    .panel.viewer-fullscreen .viewer {
      grid-template-columns: 1fr 360px;
      height: 100%;
      min-height: 0;
    }
    .panel.viewer-fullscreen .viewer-main {
      height: 100%;
      display: flex;
      min-height: 0;
    }
    .panel.viewer-fullscreen .canvas-frame {
      max-height: none;
      flex: 1 1 auto;
      width: 100%;
    }
    .panel.viewer-fullscreen .viewer-side {
      overflow: auto;
      height: 100%;
      padding-right: 4px;
    }
    @media (max-width: 900px) {
      .panel.viewer-fullscreen .viewer { grid-template-columns: 1fr; grid-template-rows: 1fr auto; overflow: auto; }
      .panel.viewer-fullscreen .canvas-frame { max-height: 46vh; }
    }

    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(var(--dark-rgb),.55);
      display: grid;
      place-items: center;
      z-index: 500;
      color: white;
      font-size: 13px;
      font-weight: 800;
      gap: 12px;
    }
    .loading-overlay .spinner {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,.25);
      border-top-color: #fff;
      animation: spin .8s linear infinite;
    }
    .loading-box { display: grid; justify-items: center; gap: 10px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .compare-modal {
      position: fixed;
      inset: 0;
      z-index: 550;
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }
    .compare-head {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .compare-body {
      flex: 1 1 auto;
      overflow: auto;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 14px;
      padding: 14px;
      align-items: start;
    }
    .compare-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 14px;
      align-content: start;
    }
    .compare-issue-form {
      display: grid;
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      position: sticky;
      top: 0;
    }
    @media (max-width: 900px) {
      .compare-body { grid-template-columns: 1fr; }
    }
    .compare-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .compare-panel canvas {
      width: 100%;
      height: auto;
      display: block;
      background: var(--dark);
    }
    .compare-caption {
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 800;
      color: var(--ink);
      border-top: 1px solid var(--line);
    }

    .meta-table {
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      font-size: 12px;
    }
    .meta-row {
      display: grid;
      grid-template-columns: 92px 1fr auto;
      border-bottom: 1px solid var(--line);
    }
    .meta-row:last-child { border-bottom: 0; }
    .meta-key { background: var(--soft); color: var(--muted); padding: 8px; font-weight: 800; }
    .meta-val { padding: 8px; overflow-wrap: anywhere; }
    .meta-copy {
      min-height: 0;
      align-self: center;
      margin: 4px;
      padding: 4px 7px;
      font-size: 10px;
    }

    .issue-form { display: grid; gap: 10px; }
    .check-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .check {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 7px 8px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      background: white;
    }
    .check:has(input:checked) {
      border-color: #eec4d0;
      background: #fbeef1;
      color: #a94d68;
      font-weight: 800;
    }

    .box-list {
      display: grid;
      gap: 6px;
      max-height: 170px;
      overflow: auto;
    }
    .box-row {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 7px 8px;
      display: grid;
      grid-template-columns: 18px 1fr;
      gap: 8px;
      align-items: center;
      font-size: 12px;
    }
    .box-row .btn-row { grid-column: 1 / -1; }
    .box-row button.active {
      border-color: #f3f0e8;
      color: #050505;
      background: #f3f0e8;
    }
    .box-row button {
      min-height: 24px;
      padding: 3px 7px;
      font-size: 11px;
    }

    .issues-list {
      display: grid;
      gap: 6px;
      max-height: 180px;
      overflow: auto;
    }
    .issue-row {
      border: 1px solid #eec4d0;
      background: #fbf2f4;
      border-radius: 6px;
      padding: 8px;
      font-size: 12px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 8px;
    }
    .issue-row strong { overflow-wrap: anywhere; }
    .issue-row-main {
      display: grid;
      gap: 4px;
      min-width: 0;
    }
    .issue-actions {
      display: flex;
      gap: 4px;
      align-items: start;
    }
    .issue-actions button {
      min-height: 0;
      width: 26px;
      height: 26px;
      padding: 0;
      line-height: 1;
    }

    .issue-inline-select {
      grid-column: 1 / -1;
      display: grid;
      gap: 5px;
      padding: 6px 8px;
      border: 1px solid var(--line);
      background: var(--soft);
    }

    .consis-modal {
      position: fixed;
      inset: 0;
      z-index: 560;
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }
    .consis-head {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 180px auto;
      gap: 10px;
      align-items: center;
    }
    .consis-head input,
    .consis-head select { min-height: 38px; }
    .consis-board {
      flex: 1 1 auto;
      overflow: auto;
      padding: 14px;
    }
    .consis-download {
      background: #fff;
      color: #111;
      padding: 18px;
      width: 1600px;
      max-width: 100%;
      margin: 0 auto;
    }
    .consis-title {
      font-size: 26px;
      font-weight: 900;
      color: #111;
      margin: 0 0 14px;
    }
    .consis-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .consis-card {
      border: 1px solid #d8d8d8;
      background: #fff;
      display: grid;
      gap: 6px;
      padding: 8px;
      position: relative;
    }
    .consis-remove {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 26px;
      height: 26px;
      min-height: 0;
      padding: 0;
      border-radius: 50%;
      background: rgba(17,17,17,.82);
      color: #fff;
      border-color: rgba(255,255,255,.45);
      z-index: 2;
    }
    .consis-card canvas {
      width: 100%;
      aspect-ratio: 16 / 10;
      background: #111;
      display: block;
    }
    .consis-caption {
      color: #111;
      font-size: 13px;
      font-weight: 800;
      overflow-wrap: anywhere;
      min-height: 32px;
    }
    @media (max-width: 900px) {
      .consis-head { grid-template-columns: 1fr; }
      .consis-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .hidden { display: none !important; }

    @media (max-width: 1100px) {
      .layout { grid-template-columns: 1fr; }
      .panel-body { max-height: none; }
      .gallery-wrap { height: auto; }
      .toolbar { grid-template-columns: 1fr; }
    }

    :root {
      color-scheme: dark;
      --bg: #050505;
      --panel: #0a0a09;
      --text: #f3f0e8;
      --muted: #9a968c;
      --line: #2a2926;
      --soft: #12110f;
      --ink: #f3f0e8;
      --accent: #f3f0e8;
      --accent-2: #a7d7b8;
      --danger: #e58aa0;
      --warn: #d8b486;
      --ok: #a7d7b8;
      --dark: #050505;
      --dark-rgb: 5, 5, 5;
      --radius: 0;
    }

    body {
      font-family: "Courier New", Courier, "SFMono-Regular", Consolas, monospace;
      background: var(--bg);
      color: var(--text);
    }

    header,
    .panel-head,
    .toolbar,
    .class-chip-row,
    .compare-head {
      background: var(--bg);
      color: var(--text);
      border-color: var(--line);
    }

    header {
      padding: 18px 20px;
    }

    h1,
    .panel-title,
    .field label,
    button,
    .stat .num,
    .stat .label,
    .thumb-name,
    .compare-caption,
    .meta-key {
      font-weight: 400;
    }

    h1 {
      font-size: 20px;
      text-transform: uppercase;
    }

    .header-meta,
    .hint,
    .drop span,
    .thumb-meta,
    .pos-counter,
    .stat .label,
    .field label {
      color: var(--muted);
    }

    .panel,
    .stat,
    .drop,
    textarea,
    select,
    input[type="text"],
    input[type="number"],
    button,
    .class-chip,
    .thumb,
    .compare-issue-form,
    .compare-panel,
    .meta-table,
    .box-row,
    .check,
    .issue-row {
      background: var(--panel);
      color: var(--text);
      border-color: var(--line);
      border-radius: 0;
      box-shadow: none;
    }

    .drop:hover,
    button:hover,
    .class-chip:hover {
      background: #12110f;
      border-color: #5a5750;
    }

    .drop.loaded,
    .class-chip.active,
    #mainViewToggleBtn.active {
      background: #111a14;
      border-color: var(--ok);
      color: var(--ok);
    }

    button.primary {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    button.primary:hover {
      background: #ffffff;
      color: var(--bg);
    }

    button.success {
      background: transparent;
      color: var(--ok);
      border-color: var(--ok);
    }

    button.danger,
    .check:has(input:checked),
    .issue-row {
      background: #1a0f12;
      color: var(--danger);
      border-color: var(--danger);
    }

    .num.ok { color: var(--ok); }
    .num.warn { color: var(--warn); }
    .num.err { color: var(--danger); }

    .canvas-frame,
    .thumb canvas,
    .compare-panel canvas,
    .magnifier,
    .loading-overlay,
    .compare-modal {
      background: var(--bg);
    }

    .thumb:hover,
    .thumb.active {
      border-color: var(--text);
    }

    .thumb.reviewed {
      border-color: var(--ok);
    }

    .thumb.issue {
      border-color: var(--danger);
    }

    .thumb-order,
    .thumb.reviewed::before,
    .thumb.issue::before,
    .nav-arrow {
      border-radius: 0;
      background: var(--soft);
      color: var(--text);
      border: 1px solid var(--line);
    }

    .meta-key {
      background: var(--soft);
    }

    .swatch,
    .class-chip .chip-swatch {
      border-radius: 0;
    }

    .panel,
    .canvas-frame,
    .meta-table,
    .box-list,
    .issues-list,
    .compare-issue-form,
    .compare-panel {
      box-shadow: 0 0 0 1px rgba(243, 240, 232, 0.06), 0 0 18px rgba(243, 240, 232, 0.08);
    }

    .panel:hover,
    .canvas-frame:hover,
    .compare-panel:hover {
      box-shadow: 0 0 0 1px rgba(243, 240, 232, 0.18), 0 0 28px rgba(243, 240, 232, 0.14);
    }

    .class-summary {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 10px;
      box-shadow: 0 0 18px rgba(243, 240, 232, 0.08);
    }

    .class-preset-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px;
    }

    #classInput {
      display: none;
    }

    .class-edit-modal {
      position: fixed;
      inset: 0;
      z-index: 700;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.82);
    }

    .class-edit-box {
      width: min(720px, 100%);
      max-height: min(760px, calc(100vh - 40px));
      overflow: auto;
      border: 1px solid var(--line);
      background: var(--bg);
      box-shadow: 0 0 0 1px rgba(243, 240, 232, 0.12), 0 0 40px rgba(243, 240, 232, 0.14);
    }

    .class-edit-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px;
      border-bottom: 1px solid var(--line);
    }

    .class-edit-tools {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      align-items: center;
    }

    .class-edit-list {
      display: grid;
      gap: 8px;
      padding: 14px;
    }

    .class-edit-row {
      display: grid;
      grid-template-columns: 48px 30px 1fr 88px;
      gap: 10px;
      align-items: center;
    }

    .class-edit-row code {
      color: var(--muted);
    }

    .class-edit-row input {
      min-width: 0;
    }

    .class-edit-row input[type="color"] {
      width: 30px;
      height: 30px;
      padding: 0;
      border: 1px solid var(--line);
      background: transparent;
      cursor: pointer;
    }

    .box-class-once {
      opacity: 0.68;
      font-size: 11px;
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <h1>BBox QC</h1>
    <div class="header-meta">
      <span id="statusText">IMAGE / LABEL</span>
    </div>
  </header>

  <main class="layout">
    <section class="panel">
      <div class="panel-head">
        <div class="panel-title">DATA</div>
        <button onclick="resetAll()">RESET</button>
      </div>
      <div class="panel-body stack">
        <div class="field">
          <label>IMAGE</label>
          <div class="drop" id="imageDrop">
            <strong>SELECT IMAGE</strong>
            <span>JPG / JPEG / PNG</span>
          </div>
          <input id="imageInput" type="file" webkitdirectory multiple>
        </div>

        <div class="field">
          <label>LABEL</label>
          <div class="drop" id="labelDrop">
            <strong>SELECT LABEL</strong>
            <span>YOLO TXT</span>
          </div>
          <input id="labelInput" type="file" webkitdirectory multiple>
        </div>

        <div class="field">
          <label>CLASS</label>
          <div class="class-preset-row">
            <select id="classPresetSelect">
              <option value="">PROJECT CLASS</option>
              <option value="ship_task1">ship_task1</option>
              <option value="ship_task2">ship_task2</option>
            </select>
            <button type="button" onclick="applyClassPreset()">LOAD</button>
          </div>
          <div class="class-summary">
            <span id="classSummary">15 CLASS</span>
            <button type="button" onclick="openClassEditor()">EDIT</button>
          </div>
          <textarea id="classInput"></textarea>
          <div class="hint">OBJ.NAMES / CLASS LIST</div>
        </div>

        <div class="btn-row">
          <button class="primary" id="runBtn" onclick="runValidation()" disabled>RUN</button>
        </div>

        <div class="stats">
          <button class="stat filterable" type="button" data-gallery-filter="all"><div class="num" id="statImages">0</div><div class="label">IMG</div></button>
          <button class="stat filterable" type="button" data-gallery-filter="matched"><div class="num ok" id="statMatched">0</div><div class="label">MATCH</div></button>
          <button class="stat filterable" type="button" data-gallery-filter="zero"><div class="num warn" id="statZero">0</div><div class="label">ZERO</div></button>
          <button class="stat filterable" type="button" data-gallery-filter="duplicate"><div class="num warn" id="statDuplicate">0</div><div class="label">DUP</div></button>
          <div class="stat"><div class="num" id="statBoxes">0</div><div class="label">BOX</div></div>
          <div class="stat-separator"></div>
          <button class="stat filterable" type="button" data-gallery-filter="issue"><div class="num err" id="statIssues">0</div><div class="label">ISSUE</div></button>
          <button class="stat filterable" type="button" data-gallery-filter="done"><div class="num ok" id="statReviewed">0</div><div class="label">DONE</div></button>
          <div class="stat"><div class="num" id="statProgress">0%</div><div class="label">RATE</div></div>
        </div>
        <div class="export-actions">
          <button onclick="exportCsv()" id="csvBtn" disabled>XLSX</button>
          <button onclick="exportJson()" id="jsonBtn" disabled>JSON</button>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="toolbar">
        <input id="searchInput" type="text" placeholder="SEARCH FILE NAME">
      </div>
      <div class="class-chip-row" id="classChipRow"></div>
      <div class="pager gallery-pager">
        <span id="pageInfo">0 / 0</span>
        <div class="pager-actions">
          <button class="pager-prev" type="button" onclick="prevGalleryPage()">PREV</button>
          <span id="pageButtonsTop" class="pager-actions"></span>
          <button class="pager-next" type="button" onclick="nextGalleryPage()">NEXT</button>
        </div>
      </div>
      <div class="gallery-wrap">
        <div class="grid" id="gallery"></div>
      </div>
      <div class="pager gallery-pager">
        <span id="pageInfoBottom">0 / 0</span>
        <div class="pager-actions">
          <button class="pager-prev" type="button" onclick="prevGalleryPage()">PREV</button>
          <span id="pageButtonsBottom" class="pager-actions"></span>
          <button class="pager-next" type="button" onclick="nextGalleryPage()">NEXT</button>
        </div>
      </div>
    </section>

    <section class="panel" id="viewerPanel">
      <div class="panel-head">
        <div class="panel-title">REVIEW</div>
        <div class="btn-row">
          <span class="pos-counter" id="posCounter"></span>
          <button id="mainViewToggleBtn" onclick="toggleMainViewMode()" title="VIEW">IMAGE</button>
          <button onclick="prevItem()" title="PREV">PREV</button>
          <button onclick="nextItem()" title="NEXT">NEXT</button>
          <button id="fullscreenToggleBtn" onclick="toggleReviewMode()" title="FOCUS">FOCUS</button>
        </div>
      </div>
      <div class="panel-body viewer">
        <div class="viewer-main">
          <div class="canvas-frame" id="canvasFrame">
            <button class="nav-arrow nav-prev" id="navPrevBtn" onclick="prevItem()" title="PREV">‹</button>
            <canvas id="mainCanvas"></canvas>
            <button class="nav-arrow nav-next" id="navNextBtn" onclick="nextItem()" title="NEXT">›</button>
            <div class="magnifier hidden" id="magnifier"><canvas id="magnifierCanvas"></canvas></div>
          </div>
        </div>

        <div class="viewer-side">
          <div class="meta-table" id="metaTable">
            <div class="meta-row"><div class="meta-key">FILE</div><div class="meta-val">EMPTY</div></div>
          </div>

          <div class="field">
            <label>BOX</label>
            <div class="box-list" id="boxList"></div>
          </div>

          <div class="issue-form">
            <div class="field">
              <label>ISSUE</label>
              <div class="check-grid" id="issueChecks"></div>
              <div class="issue-inline-select hidden" id="missingClassField">
                <label>ACTION CLASS</label>
                <div class="check-grid" id="actionClassChecks"></div>
                <button type="button" onclick="applyActionClassIssue()">DONE</button>
              </div>
            </div>
            <div class="field">
              <label>NOTE</label>
              <textarea id="noteInput" placeholder="NOTE"></textarea>
            </div>
            <div class="btn-row">
              <button class="danger" onclick="clearCurrentIssue()">CLEAR</button>
              <button class="success" onclick="markOk()">SAVE</button>
            </div>
            <div class="hint">KEY: D / F / H</div>
          </div>

          <div class="field">
            <label>ISSUE LOG</label>
            <div class="issues-list" id="issuesList"></div>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="class-edit-modal hidden" id="classEditModal">
  <div class="class-edit-box">
    <div class="class-edit-head">
      <div class="panel-title">CLASS EDIT</div>
      <div class="btn-row">
        <button type="button" onclick="applyClassEditor()">APPLY</button>
        <button type="button" onclick="closeClassEditor()">CLOSE</button>
      </div>
    </div>
    <div class="class-edit-tools">
      <input id="bulkClassWidthInput" type="number" min="1" max="5" step="1" value="2" aria-label="ALL BOX PX">
      <button type="button" onclick="applyBulkClassWidth()">ALL PX</button>
    </div>
    <div class="class-edit-list" id="classEditList"></div>
  </div>
</div>

<div class="loading-overlay hidden" id="loadingOverlay">
  <div class="loading-box">
    <div class="spinner"></div>
    <div id="loadingText">LOADING</div>
  </div>
</div>

<div class="compare-modal hidden" id="compareModal">
  <div class="compare-head">
    <div class="panel-title" id="compareTitle">DUP COMPARE</div>
    <button onclick="closeCompareView()">CLOSE</button>
  </div>
  <div class="compare-body">
    <div class="compare-grid" id="compareGrid"></div>
    <div class="compare-issue-form">
      <div class="field">
        <label>ISSUE</label>
        <div class="check-grid" id="compareIssueChecks"></div>
      </div>
      <div class="field">
        <label>MISSING</label>
        <select id="compareMissingClassSelect"></select>
      </div>
      <div class="field">
        <label>NOTE</label>
        <textarea id="compareNoteInput" placeholder="NOTE" oninput="updateCompareIssue()"></textarea>
      </div>
      <div class="btn-row">
        <button class="success" onclick="markCompareOk()">OK</button>
        <button class="danger" onclick="clearCompareIssue()">CLEAR</button>
      </div>
      <div class="hint">DUP GROUP / XLSX TAB</div>
    </div>
  </div>
</div>

<div class="consis-modal hidden" id="consisModal">
  <div class="consis-head">
    <input id="consisTitleInput" type="text" placeholder="CONSIS TITLE" oninput="renderConsistencyBoard()">
    <select id="consisClassSelect" onchange="renderConsistencyBoard()"></select>
    <div class="btn-row">
      <button type="button" onclick="saveConsistencyIssue()">SAVE</button>
      <button type="button" onclick="downloadConsistencyBoard()">DOWNLOAD</button>
      <button type="button" onclick="closeConsistencyBoard()">CLOSE</button>
    </div>
  </div>
  <div class="consis-board">
    <div class="consis-download" id="consisDownload">
      <div class="consis-title" id="consisTitle">CONSIS</div>
      <div class="consis-grid" id="consisGrid"></div>
    </div>
  </div>
</div>

<script>
const PAGE_LIMIT = 1000;
const DEFAULT_COLORS = ['#f2867a','#6f9ce0','#5fb3a3','#f0b45c','#a685e8','#e87aa8','#6cbf7f','#5fb8cc','#ef9a5c','#8b85e8','#b3d967','#cc7070','#6ecfbe','#f5d76e','#9aa3b8'];
const CLASS_PRESETS = {
  ship_task1: [
    'burnt',
    'hume',
    'point_burnt',
    'point_hume',
    'rust',
    'rust_area',
    'point_rust',
    'chalk',
    'feathering',
    'zinc',
    'oil',
    'm/d',
    'blowhole',
    'spatter',
    'weld'
  ],
  ship_task2: [
    'contamination',
    'drop',
    'damage',
    'sagging',
    'pinhole',
    'light reflection'
  ]
};
const ISSUE_TYPES = [
  ['wrong_class', 'WRONG CLASS'],
  ['wrong_box', 'SIZE'],
  ['consis', 'CONSIS'],
  ['missing', 'MISSING'],
  ['unnecessary', 'DELETE']
];

let imageFiles = [];
let labelFiles = [];
let imageMap = new Map();
let labelMap = new Map();
let classes = [];
let classColors = {};
let classLineWidths = {};
let visibleClasses = new Set();
let classFilter = '__all__'; // '__all__' or a single class name — which images the gallery shows
let reviewableTotal = 0; // count of matched+has-boxes records, for the stable #order badge
let mainViewMode = 'overlay'; // 'overlay' | 'image' — single-image review canvas only
let magnifierImg = null; // full-res <img> for the currently selected record, used by the lens
let records = [];
let currentIndex = -1;
let issueMap = new Map();
let reviewedSet = new Set();
let objectUrlCache = new Map();
let activeBoxIndex = -1;
let issueTarget = null;
let selectedBoxIndices = new Set();

// review-mode ("하나씩 넘기기") navigation queue, snapshot of the filtered list at the
// moment review mode was entered so marking a record OK/issue doesn't yank it out from
// under the user mid-session
let reviewQueue = [];
let reviewPos = -1;

let mainImageCache = new Map(); // File -> Promise<HTMLImageElement>
let thumbBitmapCache = new Map(); // File -> Promise<ImageBitmap|HTMLImageElement>
let galleryThumbMap = new Map(); // record.id -> { card, canvas }
let galleryObserver = null;
let searchDebounceTimer = null;
let galleryPage = 0;
let lastGalleryRows = [];
let consistencyRows = [];
let galleryFilter = 'all';
const userEmail = sessionStorage.getItem('fromliloUserEmail') || localStorage.getItem('fromliloUserEmail') || '';
let objNamesClasses = [];

const imageInput = document.getElementById('imageInput');
const labelInput = document.getElementById('labelInput');
const imageDrop = document.getElementById('imageDrop');
const labelDrop = document.getElementById('labelDrop');

function localFileKey(file) {
  if (!file) return '';
  return `${file.name}__${file.size}__${file.lastModified}`;
}

function recordSource(record) {
  if (record.r2Key) {
    return {
      sourceType: 'r2',
      imageKey: record.r2Key,
      imageFilename: record.imageFile?.name || record.baseName
    };
  }
  return {
    sourceType: 'local',
    imageKey: localFileKey(record.imageFile) || record.id,
    imageFilename: record.imageFile?.name || record.baseName
  };
}

function actionFromIssue(issue) {
  if (!issue) return 'approved';
  const entries = issue.issues || [issue];
  return entries.flatMap(entry => entry.types || []).join('|') || 'issue';
}

function summarizeIssue(issue) {
  const entries = issue?.issues || (issue ? [issue] : []);
  return {
    types: Array.from(new Set(entries.flatMap(entry => entry.types || []))).join('|'),
    missingClass: entries.map(entry => entry.missingClass).filter(Boolean).join('|'),
    note: entries.map(entry => entry.note).filter(Boolean).join(' | ')
  };
}

async function saveReviewResult(record, action, issue = null) {
  if (!record || !userEmail) return;
  const source = recordSource(record);
  const issueEntries = issue?.issues || (issue ? [issue] : []);
  const issueTypes = Array.from(new Set(issueEntries.flatMap(entry => entry.types || [])));
  const payload = {
    userEmail,
    ...source,
    annotationFilename: record.labelFile?.name || '',
    action,
    note: issueEntries.map(entry => entry.note).filter(Boolean).join(' | '),
    issueTypes,
    missingClass: issueEntries.map(entry => entry.missingClass).filter(Boolean).join('|'),
    boxCount: record.boxes?.length || 0,
    status: record.status || ''
  };

  try {
    const response = await fetch('/api/review-result', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!response.ok) throw new Error('review_result_save_failed');
  } catch (error) {
    console.warn(error);
  }
}
const runBtn = document.getElementById('runBtn');

function getRecordIssue(record) {
  if (!record) return null;
  const issue = issueMap.get(record.id);
  if (!issue) return null;
  if (issue.issues) return issue;
  return { id: record.id, file: record.baseName, issues: [issue], boxCount: record.boxes.length, status: record.status };
}

function setRecordIssues(record, issues) {
  if (!record) return;
  if (!issues.length) {
    issueMap.delete(record.id);
    return;
  }
  issueMap.set(record.id, {
    id: record.id,
    file: record.baseName,
    issues,
    boxCount: record.boxes.length,
    status: record.status
  });
}

function targetKey(target) {
  if (!target) return 'image';
  if (target.type === 'boxes') return `boxes:${target.boxIndices.join(',')}`;
  if (target.type === 'box') return `box:${target.boxIndex}`;
  if (target.type === 'class') return `class:${target.className}`;
  return target.type || 'image';
}

function targetLabel(target) {
  if (!target) return 'IMAGE';
  if (target.type === 'boxes') return `BOX ${target.boxIndices.map(idx => idx + 1).join(', ')}`;
  if (target.type === 'box') return `BOX ${target.boxIndex + 1}`;
  if (target.type === 'class') return `CLASS ${target.className}`;
  return 'IMAGE';
}

function upsertIssue(record, entry, persist = true) {
  const current = getRecordIssue(record)?.issues || [];
  const key = entry.targetKey;
  const next = current.filter(item => item.targetKey !== key);
  next.push(entry);
  setRecordIssues(record, next);
  if (persist) saveReviewResult(record, actionFromIssue(getRecordIssue(record)), getRecordIssue(record));
}

function removeIssue(recordId, key) {
  const record = records.find(item => item.id === recordId);
  if (!record) return;
  const current = getRecordIssue(record)?.issues || [];
  const next = current.filter(item => item.targetKey !== key);
  setRecordIssues(record, next);
  saveReviewResult(record, next.length ? actionFromIssue(getRecordIssue(record)) : 'cleared', getRecordIssue(record));
  renderStats();
  renderIssuesList();
  updateGalleryHighlights();
}

imageDrop.addEventListener('click', () => imageInput.click());
labelDrop.addEventListener('click', () => labelInput.click());
imageInput.addEventListener('change', e => handleImages(e.target.files));
labelInput.addEventListener('change', e => handleLabels(e.target.files));
document.getElementById('searchInput').addEventListener('input', () => {
  clearTimeout(searchDebounceTimer);
  searchDebounceTimer = setTimeout(() => {
    galleryPage = 0;
    renderGallery();
  }, 200);
});
document.querySelectorAll('[data-gallery-filter]').forEach(btn => {
  btn.addEventListener('click', () => setGalleryFilter(btn.dataset.galleryFilter));
});
document.getElementById('classInput').addEventListener('input', () => {
  readClassInput();
  renderClassControls();
  updateClassSummary();
  renderCurrent();
});
function applyClassPreset() {
  const key = document.getElementById('classPresetSelect').value;
  const preset = CLASS_PRESETS[key];
  if (!preset) return;
  document.getElementById('classInput').value = preset.join('\n');
  readClassInput();
  renderClassControls();
  updateClassSummary();
  renderCurrent();
}

function normalizedStem(name) {
  return name.replace(/^.*[\\/]/, '').replace(/\.[^/.]+$/, '').normalize('NFC').toLowerCase();
}

function filePath(file) {
  return file.webkitRelativePath || file.name;
}

function updateClassSummary() {
  const summary = document.getElementById('classSummary');
  if (!summary) return;
  const count = document.getElementById('classInput').value
    .split(/\r?\n|,/)
    .map(s => s.trim())
    .filter(Boolean).length;
  summary.textContent = count ? `${count} CLASS` : 'LABEL CLASS';
}

function openClassEditor() {
  readClassInput();
  const list = document.getElementById('classEditList');
  list.innerHTML = '';
  document.getElementById('bulkClassWidthInput').value = defaultClassLineWidth();
  classes.forEach((name, idx) => {
    const color = classColors[name] || DEFAULT_COLORS[idx % DEFAULT_COLORS.length];
    const lineWidth = classLineWidths[name] || 2;
    const row = document.createElement('div');
    row.className = 'class-edit-row';
    row.innerHTML = `
      <code>${idx}</code>
      <input type="color" value="${color}" data-class-color="${idx}" title="COLOR">
      <input type="text" value="${escapeHtml(name)}" data-class-name="${idx}">
      <input type="number" min="1" max="5" step="1" value="${lineWidth}" data-class-width="${idx}" title="BOX PX">
    `;
    list.appendChild(row);
  });
  document.getElementById('classEditModal').classList.remove('hidden');
}

function defaultClassLineWidth() {
  const widths = classes.map(name => classLineWidths[name]).filter(Boolean);
  if (!widths.length) return 2;
  const first = widths[0];
  return widths.every(width => width === first) ? first : 2;
}

function applyBulkClassWidth() {
  const raw = Number(document.getElementById('bulkClassWidthInput').value || 2);
  const width = Math.max(1, Math.min(5, Number.isFinite(raw) ? Math.round(raw) : 2));
  document.querySelectorAll('#classEditList input[data-class-width]').forEach(input => {
    input.value = String(width);
  });
}

function closeClassEditor() {
  document.getElementById('classEditModal').classList.add('hidden');
}

function applyClassEditor() {
  const previous = [...classes];
  const nameInputs = Array.from(document.querySelectorAll('#classEditList input[data-class-name]'));
  const colorInputs = Array.from(document.querySelectorAll('#classEditList input[data-class-color]'));
  const widthInputs = Array.from(document.querySelectorAll('#classEditList input[data-class-width]'));
  const next = nameInputs
    .map(input => input.value.trim())
    .filter(Boolean);
  if (!next.length) return;

  const nextColors = {};
  const nextWidths = {};
  next.forEach((name, idx) => {
    nextColors[name] = colorInputs[idx]?.value || classColors[previous[idx]] || classColors[name] || DEFAULT_COLORS[idx % DEFAULT_COLORS.length];
    const width = Number(widthInputs[idx]?.value || classLineWidths[previous[idx]] || classLineWidths[name] || 2);
    nextWidths[name] = Math.max(1, Math.min(5, Number.isFinite(width) ? Math.round(width) : 2));
  });
  classColors = nextColors;
  classLineWidths = nextWidths;
  document.getElementById('classInput').value = next.join('\n');

  records.forEach(record => {
    record.boxes.forEach(box => {
      if (next[box.classId]) box.className = next[box.classId];
    });
    if (record.labelVariants) {
      record.labelVariants.forEach(variant => {
        variant.boxes.forEach(box => {
          if (next[box.classId]) box.className = next[box.classId];
        });
      });
    }
  });

  readClassInput();
  renderClassControls();
  populateMissingClassOptions();
  renderGallery();
  if (currentIndex >= 0) selectRecord(currentIndex);
  closeClassEditor();
}

function handleImages(files) {
  const all = Array.from(files).filter(f => /\.(jpg|jpeg|png)$/i.test(f.name));
  // If the picked folder contains an "output" subfolder (the finalized image
  // set), only match against those instead of every image under the whole
  // source tree — otherwise unrelated source images bloat the gallery.
  const outputOnly = all.filter(f => filePath(f).split(/[\\/]/).includes('output'));
  imageFiles = outputOnly.length ? outputOnly : all;
  imageDrop.classList.add('loaded');
  imageDrop.querySelector('strong').textContent = `IMG ${imageFiles.length}`;
  imageDrop.querySelector('span').textContent = outputOnly.length ? `OUTPUT / ${all.length}` : 'LOADED';
  checkReady();
}

async function handleLabels(files) {
  const all = Array.from(files);
  const yoloTxt = all.filter(f => /\.txt$/i.test(f.name) && !/^(train|test|valid|classes)\.txt$/i.test(f.name));
  const objTrainTxt = yoloTxt.filter(f => filePath(f).split(/[\\/]/).includes('obj_train_data'));
  labelFiles = objTrainTxt.length ? objTrainTxt : yoloTxt;
  const objNames = all.find(f => /obj\.names$/i.test(f.name));
  if (objNames) {
    const text = await objNames.text();
    objNamesClasses = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  } else {
    objNamesClasses = [];
  }
  await buildClassesFromLabelFiles();
  labelDrop.classList.add('loaded');
  labelDrop.querySelector('strong').textContent = `LBL ${labelFiles.length}`;
  labelDrop.querySelector('span').textContent = objNames ? `OBJ.NAMES / ${classes.length} CLASS` : `${classes.length} CLASS`;
  checkReady();
}

async function collectClassIdsFromFile(file) {
  const text = await file.text();
  const ids = [];
  text.split(/\r?\n/).forEach(line => {
    const clean = line.trim();
    if (!clean) return;
    const classId = Number(clean.split(/\s+/)[0]);
    if (Number.isInteger(classId) && classId >= 0) ids.push(classId);
  });
  return ids;
}

async function buildClassesFromLabelFiles() {
  const idSet = new Set();
  const idLists = await Promise.all(labelFiles.map(collectClassIdsFromFile));
  idLists.flat().forEach(id => idSet.add(id));
  const ids = Array.from(idSet).sort((a, b) => a - b);
  const maxId = ids.length ? Math.max(...ids) : -1;
  const next = [];
  for (let id = 0; id <= maxId; id++) {
    next[id] = objNamesClasses[id] || `CLASS_${id}`;
  }
  document.getElementById('classInput').value = next.filter(Boolean).join('\n');
  readClassInput();
  renderClassControls();
  updateClassSummary();
}

function checkReady() {
  runBtn.disabled = !(imageFiles.length && labelFiles.length);
}

function readClassInput() {
  classes = document.getElementById('classInput').value.split(/\r?\n|,/).map(s => s.trim()).filter(Boolean);
  classes.forEach((name, idx) => {
    if (!classColors[name]) classColors[name] = DEFAULT_COLORS[idx % DEFAULT_COLORS.length];
    if (!classLineWidths[name]) classLineWidths[name] = 2;
  });
  visibleClasses = classFilter === '__all__' ? new Set(classes) : new Set([classFilter]);
  updateClassSummary();
  renderMissingClassOptions();
}

function autoDetectDuplicateBoxes() {
  records.forEach(record => {
    if (record.status !== 'matched' || !record.boxes.length) return;
    const seen = new Map();
    record.boxes.forEach((box, idx) => {
      const coordKey = [box.xc, box.yc, box.bw, box.bh].join('|');
      if (!seen.has(coordKey)) {
        seen.set(coordKey, idx);
        return;
      }
      const firstIdx = seen.get(coordKey);
      const target = { type: 'box', boxIndex: idx, className: box.className };
      upsertIssue(record, {
        target,
        targetKey: targetKey(target),
        targetLabel: targetLabel(target),
        types: ['duplicate'],
        missingClass: '',
        note: `DUP BOX ${firstIdx + 1}`
      }, false);
    });
  });
}

async function runValidation() {
  if (!classes.length) await buildClassesFromLabelFiles();
  readClassInput();
  records = [];
  issueMap.clear();
  reviewedSet.clear();
  reviewQueue = [];
  reviewPos = -1;
  imageMap = new Map();
  labelMap = new Map();
  activeBoxIndex = -1;
  issueTarget = null;
  selectedBoxIndices.clear();
  mainImageCache = new Map();
  thumbBitmapCache = new Map();
  showLoading('MATCHING');

  for (const file of imageFiles) {
    const key = normalizedStem(file.name);
    if (!imageMap.has(key)) imageMap.set(key, []);
    imageMap.get(key).push(file);
  }
  for (const file of labelFiles) {
    const key = normalizedStem(file.name);
    if (!labelMap.has(key)) labelMap.set(key, []);
    labelMap.get(key).push(file);
  }

  const allKeys = new Set([...imageMap.keys(), ...labelMap.keys()]);
  const sortedKeys = Array.from(allKeys).sort((a, b) => a.localeCompare(b, 'ko', { numeric: true, sensitivity: 'base' }));

  for (const key of sortedKeys) {
    const images = imageMap.get(key) || [];
    const labels = labelMap.get(key) || [];
    const status = images.length && labels.length ? 'matched' : images.length ? 'missing-label' : 'missing-image';
    records.push({
      id: key,
      baseName: (images[0] || labels[0]).name.replace(/\.[^/.]+$/, ''),
      imageFile: images[0] || null,
      labelFile: labels[0] || null,
      allImageFiles: images,
      allLabelFiles: labels,
      duplicateImages: Math.max(0, images.length - 1),
      duplicateLabels: Math.max(0, labels.length - 1),
      status,
      boxes: [],
      labelVariants: null,
      parseError: '',
      imageSize: null
    });
  }

  document.getElementById('loadingText').textContent = `PARSE 0/${records.length}`;
  let parsed = 0;
  Promise.all(records.map(r => parseRecord(r).then(() => {
    parsed++;
    if (parsed % 25 === 0 || parsed === records.length) {
      document.getElementById('loadingText').textContent = `PARSE ${parsed}/${records.length}`;
    }
  }))).then(() => {
    autoDetectDuplicateBoxes();
    // Stable review order (#1, #2, ...) assigned once over the reviewable set
    // (matched + has boxes) in filename order — doesn't shift when the user
    // later filters/searches, so it can be used to find where a paused
    // review session left off.
    let orderCounter = 0;
    records.forEach(r => {
      r.order = (r.status === 'matched' && r.boxes.length > 0 && !isDuplicate(r)) ? ++orderCounter : null;
    });
    reviewableTotal = orderCounter;

    renderClassControls();
    renderStats();
    renderGallery();
    const matchedIdx = records.findIndex(r => r.status === 'matched' && r.boxes.length > 0 && !isDuplicate(r));
    if (matchedIdx >= 0) {
      selectRecord(matchedIdx);
    } else {
      currentIndex = -1;
      updateGalleryHighlights();
      updatePosCounter();
      renderCurrent();
    }
    document.getElementById('csvBtn').disabled = false;
    document.getElementById('jsonBtn').disabled = false;
    document.getElementById('statusText').textContent = 'READY';
    hideLoading();
  });
}

function showLoading(text) {
  document.getElementById('loadingText').textContent = text;
  document.getElementById('loadingOverlay').classList.remove('hidden');
}

function hideLoading() {
  document.getElementById('loadingOverlay').classList.add('hidden');
}

function isDuplicate(record) {
  return record.duplicateImages > 0 || record.duplicateLabels > 0;
}

// Immediate parent folder name, used to tell duplicate copies of the same
// filename apart (e.g. two "IMG_1234.txt" living under different category
// folders) without assuming any particular folder-naming convention.
function fileSourceTag(file) {
  const path = filePath(file);
  const parts = path.split(/[\\/]/);
  return parts.length > 1 ? parts[parts.length - 2] : path;
}

// Best-effort pairing of a label variant with "its" image copy: prefer the
// image living under the same immediate folder, fall back to the first
// image if the folder layout doesn't line up 1:1.
function findImageForSource(record, source) {
  return record.allImageFiles.find(f => fileSourceTag(f) === source) || record.imageFile;
}

let currentCompareRecord = null;

async function openCompareView(record) {
  currentCompareRecord = record;
  const variants = record.labelVariants || [];
  document.getElementById('compareTitle').textContent = `DUP — ${record.baseName}`;
  const grid = document.getElementById('compareGrid');
  grid.innerHTML = '';
  document.getElementById('compareModal').classList.remove('hidden');
  loadCompareIssueForm(record);

  for (const variant of variants) {
    const panel = document.createElement('div');
    panel.className = 'compare-panel';
    panel.innerHTML = `<canvas></canvas><div class="compare-caption">${escapeHtml(variant.source)} — ${variant.boxCount} BOX</div>`;
    grid.appendChild(panel);
    const canvas = panel.querySelector('canvas');
    const imageFile = findImageForSource(record, variant.source);
    if (!imageFile) continue;
    const img = await loadImage(imageFile);
    const scale = Math.min(1, 900 / img.naturalWidth);
    const w = Math.max(1, Math.round(img.naturalWidth * scale));
    const h = Math.max(1, Math.round(img.naturalHeight * scale));
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);
    drawBoxes(ctx, { boxes: variant.boxes }, w, h, img.naturalWidth, img.naturalHeight, true);
  }
}

function closeCompareView() {
  document.getElementById('compareModal').classList.add('hidden');
  currentCompareRecord = null;
}

function buildCompareIssueChecks() {
  const wrap = document.getElementById('compareIssueChecks');
  wrap.innerHTML = '';
  ISSUE_TYPES.forEach(([value, label]) => {
    const item = document.createElement('label');
    item.className = 'check';
    item.innerHTML = `<input type="checkbox" value="${value}" onchange="updateCompareIssue()"> ${label}`;
    wrap.appendChild(item);
  });
}
buildCompareIssueChecks();

function loadCompareIssueForm(record) {
  const issue = getRecordIssue(record);
  const entry = issue?.issues?.find(item => item.targetKey === 'image') || issue?.issues?.[0] || null;
  document.querySelectorAll('#compareIssueChecks input').forEach(input => input.checked = entry?.types?.includes(input.value) || false);
  document.getElementById('compareMissingClassSelect').value = entry?.missingClass || '';
  document.getElementById('compareNoteInput').value = entry?.note || '';
}

function updateCompareIssue() {
  const record = currentCompareRecord;
  if (!record) return;
  const types = Array.from(document.querySelectorAll('#compareIssueChecks input:checked')).map(i => i.value);
  const missingClass = document.getElementById('compareMissingClassSelect').value;
  const note = document.getElementById('compareNoteInput').value.trim();
  const target = { type: 'image' };
  if (!types.length && !missingClass && !note) removeIssue(record.id, targetKey(target));
  else upsertIssue(record, {
    target,
    targetKey: targetKey(target),
    targetLabel: targetLabel(target),
    types,
    missingClass: types.includes('missing') ? missingClass : '',
    note
  });
  renderStats();
  renderIssuesList();
  updateGalleryHighlights();
}

function markCompareOk() {
  const record = currentCompareRecord;
  if (!record) return;
  issueMap.delete(record.id);
  reviewedSet.add(record.id);
  saveReviewResult(record, 'approved');
  loadCompareIssueForm(record);
  renderStats();
  renderIssuesList();
  updateGalleryHighlights();
}

function clearCompareIssue() {
  const record = currentCompareRecord;
  if (!record) return;
  issueMap.delete(record.id);
  reviewedSet.delete(record.id);
  saveReviewResult(record, 'cleared');
  loadCompareIssueForm(record);
  renderStats();
  renderIssuesList();
  updateGalleryHighlights();
}

// Shared YOLO-line parser used both for a record's primary label file and,
// for duplicate-filename records, every other candidate label file so their
// full box sets (not just counts) are available for the compare view.
async function parseBoxesFromFile(file) {
  const text = await file.text();
  const lines = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  const boxes = [];
  let parseError = '';
  for (let i = 0; i < lines.length; i++) {
    const parts = lines[i].split(/\s+/);
    if (parts.length !== 5) {
      parseError = `LABEL ${i + 1} FORMAT`;
      continue;
    }
    const [cidRaw, xcRaw, ycRaw, wRaw, hRaw] = parts;
    const classId = Number(cidRaw);
    const xc = Number(xcRaw), yc = Number(ycRaw), bw = Number(wRaw), bh = Number(hRaw);
    if (![classId, xc, yc, bw, bh].every(Number.isFinite)) {
      parseError = `LABEL ${i + 1} NUMBER`;
      continue;
    }
    const className = classes[classId] || String(classId);
    boxes.push({ classId, className, xc, yc, bw, bh, row: i + 1 });
    if (!classColors[className]) classColors[className] = DEFAULT_COLORS[classId % DEFAULT_COLORS.length];
    visibleClasses.add(className);
  }
  return { boxes, parseError };
}

async function parseRecord(record) {
  if (record.duplicateLabels > 0) {
    record.labelVariants = await Promise.all(record.allLabelFiles.map(async f => {
      const { boxes } = await parseBoxesFromFile(f);
      return { source: fileSourceTag(f), boxCount: boxes.length, boxes, file: f };
    }));
  }
  if (!record.labelFile) return;
  const { boxes, parseError } = await parseBoxesFromFile(record.labelFile);
  record.boxes = boxes;
  if (parseError) record.parseError = parseError;
}

function renderStats() {
  const matched = records.filter(r => r.status === 'matched').length;
  const zero = records.filter(r => r.status === 'matched' && r.boxes.length === 0 && !isDuplicate(r)).length;
  const duplicate = records.filter(r => r.status === 'matched' && isDuplicate(r)).length;
  const boxes = records.reduce((sum, r) => sum + r.boxes.length, 0);
  const reviewed = records.filter(r => r.status === 'matched' && (reviewedSet.has(r.id) || issueMap.has(r.id))).length;
  const issueCount = Array.from(issueMap.values()).reduce((sum, issue) => sum + (issue.issues?.length || (issue.types?.length ? 1 : 0)), 0);
  document.getElementById('statImages').textContent = imageFiles.length;
  document.getElementById('statMatched').textContent = matched;
  document.getElementById('statZero').textContent = zero;
  document.getElementById('statDuplicate').textContent = duplicate;
  document.getElementById('statBoxes').textContent = boxes;
  document.getElementById('statIssues').textContent = issueCount;
  document.getElementById('statReviewed').textContent = reviewed;
  document.getElementById('statProgress').textContent = matched ? `${Math.round(reviewed / matched * 100)}%` : '0%';
  document.querySelectorAll('[data-gallery-filter]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.galleryFilter === galleryFilter);
  });
}

function isReviewed(record) {
  return reviewedSet.has(record.id) || issueMap.has(record.id);
}

function renderClassControls() {
  const all = Array.from(new Set(classes));
  records.forEach(r => r.boxes.forEach(b => all.includes(b.className) || all.push(b.className)));
  all.forEach((name, idx) => {
    if (!classColors[name]) classColors[name] = DEFAULT_COLORS[idx % DEFAULT_COLORS.length];
    if (!classLineWidths[name]) classLineWidths[name] = 2;
  });
  if (classFilter !== '__all__' && !all.includes(classFilter)) classFilter = '__all__';

  const row = document.getElementById('classChipRow');
  row.innerHTML = '';
  const counts = classBoxCounts();
  row.appendChild(buildClassChip('__all__', `ALL ${records.reduce((sum, r) => sum + r.boxes.length, 0)}`));
  all.forEach(name => row.appendChild(buildClassChip(name, `${name} ${counts.get(name) || 0}`, classColors[name])));
  renderConsistencyClassOptions(all);

  renderMissingClassOptions();
}

function classBoxCounts() {
  const counts = new Map();
  records.forEach(record => {
    record.boxes.forEach(box => counts.set(box.className, (counts.get(box.className) || 0) + 1));
  });
  return counts;
}

function renderConsistencyClassOptions(allClasses = classes) {
  const select = document.getElementById('consisClassSelect');
  if (!select) return;
  const current = select.value;
  select.innerHTML = '';
  allClasses.forEach(name => {
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name;
    select.appendChild(opt);
  });
  if (current && allClasses.includes(current)) select.value = current;
}

function buildClassChip(value, label, color) {
  const chip = document.createElement('button');
  chip.type = 'button';
  chip.className = `class-chip ${classFilter === value ? 'active' : ''}`;
  chip.innerHTML = color ? `<span class="chip-swatch" style="background:${color}"></span>${escapeHtml(label)}` : escapeHtml(label);
  chip.addEventListener('click', () => setClassFilter(value));
  return chip;
}

function renderMissingClassOptions() {
  const actionWrap = document.getElementById('actionClassChecks');
  actionWrap.innerHTML = '';
  classes.forEach(name => {
    const item = document.createElement('label');
    item.className = 'check';
    item.innerHTML = `<input type="checkbox" value="${escapeHtml(name)}"> ${escapeHtml(name)}`;
    actionWrap.appendChild(item);
  });

  ['compareMissingClassSelect'].forEach(id => {
    const select = document.getElementById(id);
    select.innerHTML = '<option value="">NONE</option>';
    classes.forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      select.appendChild(opt);
    });
  });
}

function setClassFilter(value) {
  classFilter = value;
  visibleClasses = value === '__all__' ? new Set(classes) : new Set([value]);
  galleryPage = 0;
  renderClassControls();
  renderGallery();
  renderCurrent();
}

function setGalleryFilter(value) {
  galleryFilter = value || 'all';
  galleryPage = 0;
  renderStats();
  renderGallery();
}

// The gallery is split into three mutually exclusive buckets so that files
// with an unresolved filename collision (duplicate) or with no box data
// (zero) never silently show up mixed into the normal "전체"/class-filtered
// view — they only appear when their own filter tab is selected.
function filteredRecords() {
  const q = document.getElementById('searchInput').value.trim().normalize('NFC').toLowerCase();
  const f = galleryFilter;
  return records.filter(r => {
    if (f === 'all') {
      if (!r.imageFile) return false;
    } else if (r.status !== 'matched') return false;
    const dup = isDuplicate(r);
    if (f === 'all') {
      // keep every uploaded image record in the main view
    } else if (f === 'matched') {
      // keep every matched image in the main view, including duplicate and zero-box records
    } else if (f === 'duplicate') {
      if (!dup) return false;
    } else if (f === 'zero') {
      if (dup || r.boxes.length !== 0) return false;
    } else if (f === 'box') {
      if (dup || r.boxes.length === 0) return false;
    } else {
      if (dup || r.boxes.length === 0) return false;
      if (f === 'issue' && !issueMap.has(r.id)) return false;
      if (f === 'unreviewed' && isReviewed(r)) return false;
      if (f === 'done' && !isReviewed(r)) return false;
    }
    const imagePath = r.imageFile ? filePath(r.imageFile) : '';
    const haystack = [r.baseName, r.imageFile?.name || '', r.labelFile?.name || '', imagePath.split(/[\\/]/).pop() || '']
      .join(' ')
      .normalize('NFC')
      .toLowerCase();
    if (q && !haystack.includes(q)) return false;
    if (classFilter !== '__all__' && !r.boxes.some(b => b.className === classFilter)) return false;
    return true;
  });
}

function thumbClassName(record) {
  const dup = record.isVariant || isDuplicate(record);
  const dupOrZero = dup ? 'dup' : (record.boxes.length === 0 ? 'zero-box' : '');
  // A variant card's issue/review state belongs to its parent duplicate
  // group's id, not the variant's own synthetic id.
  const checkId = record.isVariant ? record.parentRecord.id : record.id;
  return `thumb ${record.id === records[currentIndex]?.id ? 'active' : ''} ${issueMap.has(checkId) ? 'issue' : (isReviewed({ id: checkId }) ? 'reviewed' : '')} ${dupOrZero}`;
}

function thumbOrderLabel(record) {
  if (record.isVariant) return record.variantSource;
  if (record.order) return `#${record.order}`;
  if (isDuplicate(record)) return 'DUP';
  if (record.status === 'matched' && record.boxes.length === 0) return 'ZERO';
  return '-';
}

// Full rebuild: only call when the *set/order* of visible thumbnails changes
// (search, filter, or data reload). Thumbnails are decoded lazily as they
// scroll into view instead of all-at-once, which is what made the gallery
// feel slow with large datasets.
// In the "중복 파일명" filter, every duplicate copy (one per conflicting
// label file) gets its own thumbnail card instead of collapsing the whole
// group into a single card — so all versions are visible side by side in
// the grid itself, not hidden behind a click.
function duplicateVariantRows() {
  const q = document.getElementById('searchInput').value.trim().normalize('NFC').toLowerCase();
  const rows = [];
  records.forEach(r => {
    if (r.status !== 'matched' || !isDuplicate(r)) return;
    const haystack = [r.baseName, r.imageFile?.name || '', r.labelFile?.name || ''].join(' ').normalize('NFC').toLowerCase();
    if (q && !haystack.includes(q)) return;
    (r.labelVariants || []).forEach((variant, i) => {
      rows.push({
        id: `${r.id}__v${i}`,
        baseName: r.baseName,
        imageFile: findImageForSource(r, variant.source),
        boxes: variant.boxes,
        status: 'matched',
        order: null,
        isVariant: true,
        variantSource: variant.source,
        parentRecord: r
      });
    });
  });
  return rows;
}

function renderGallery() {
  const gallery = document.getElementById('gallery');
  gallery.innerHTML = '';
  galleryThumbMap.clear();
  if (galleryObserver) galleryObserver.disconnect();

  const isDuplicateView = galleryFilter === 'duplicate';
  lastGalleryRows = isDuplicateView ? duplicateVariantRows() : filteredRecords();
  const totalPages = Math.max(1, Math.ceil(lastGalleryRows.length / PAGE_LIMIT));
  galleryPage = Math.max(0, Math.min(galleryPage, totalPages - 1));
  const rows = lastGalleryRows.slice(galleryPage * PAGE_LIMIT, (galleryPage + 1) * PAGE_LIMIT);
  updateGalleryPager(lastGalleryRows.length, rows.length, totalPages);
  if (!rows.length) {
    gallery.innerHTML = '<div class="gallery-empty">EMPTY</div>';
    return;
  }

  galleryObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const canvas = entry.target;
      const entryInfo = galleryThumbMap.get(canvas.dataset.recordId);
      if (entryInfo && !canvas.dataset.rendered) {
        canvas.dataset.rendered = '1';
        drawThumbCanvas(entryInfo.record, canvas);
      }
      galleryObserver.unobserve(canvas);
    });
  }, { root: document.getElementById('gallery').closest('.gallery-wrap'), rootMargin: '600px 0px' });

  rows.forEach(record => {
    const card = document.createElement('div');
    card.className = thumbClassName(record);
    card.innerHTML = `
      <div class="thumb-order">${thumbOrderLabel(record)}</div>
      <canvas></canvas>
      <div class="thumb-foot">
        <div class="thumb-name" title="${escapeHtml(record.baseName)}">${escapeHtml(record.baseName)}</div>
        <div class="thumb-meta"><span>${statusLabel(record)}</span><span>${record.boxes.length} boxes</span></div>
      </div>
    `;
    const canvas = card.querySelector('canvas');
    canvas.dataset.recordId = record.id;
    card.addEventListener('click', () => {
      if (record.isVariant) {
        openCompareView(record.parentRecord);
        return;
      }
      reviewQueue = filteredRecords();
      reviewPos = reviewQueue.indexOf(record);
      selectRecord(records.indexOf(record));
      enterReviewMode();
    });
    gallery.appendChild(card);
    galleryThumbMap.set(record.id, { card, canvas, record });
    galleryObserver.observe(canvas);
  });
}

function resetGalleryPageAndRender() {
  galleryPage = 0;
  renderGallery();
}

function updateGalleryPager(total, visible, totalPages) {
  const info = document.getElementById('pageInfo');
  const bottomInfo = document.getElementById('pageInfoBottom');
  const start = total ? galleryPage * PAGE_LIMIT + 1 : 0;
  const end = total ? start + visible - 1 : 0;
  const label = `${start}-${end} / ${total}`;
  info.textContent = label;
  bottomInfo.textContent = label;
  renderPageButtons('pageButtonsTop', totalPages);
  renderPageButtons('pageButtonsBottom', totalPages);
  document.querySelectorAll('.pager-prev').forEach(btn => btn.disabled = galleryPage <= 0);
  document.querySelectorAll('.pager-next').forEach(btn => btn.disabled = galleryPage >= totalPages - 1);
}

function pageButtonIndexes(totalPages) {
  if (totalPages <= 9) return Array.from({ length: totalPages }, (_, i) => i);
  const set = new Set([0, totalPages - 1, galleryPage - 2, galleryPage - 1, galleryPage, galleryPage + 1, galleryPage + 2]);
  return Array.from(set).filter(i => i >= 0 && i < totalPages).sort((a, b) => a - b);
}

function renderPageButtons(id, totalPages) {
  const wrap = document.getElementById(id);
  wrap.innerHTML = '';
  let prev = -1;
  pageButtonIndexes(totalPages).forEach(index => {
    if (prev >= 0 && index - prev > 1) {
      const ellipsis = document.createElement('span');
      ellipsis.className = 'page-ellipsis';
      ellipsis.textContent = '...';
      wrap.appendChild(ellipsis);
    }
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = `page-number ${index === galleryPage ? 'active' : ''}`;
    btn.textContent = String(index + 1);
    btn.addEventListener('click', () => goGalleryPage(index));
    wrap.appendChild(btn);
    prev = index;
  });
}

function prevGalleryPage() {
  if (galleryPage <= 0) return;
  galleryPage--;
  renderGallery();
}

function nextGalleryPage() {
  const totalPages = Math.max(1, Math.ceil(lastGalleryRows.length / PAGE_LIMIT));
  if (galleryPage >= totalPages - 1) return;
  galleryPage++;
  renderGallery();
}

function goGalleryPage(value) {
  galleryPage = Number(value) || 0;
  renderGallery();
}

// Cheap update after selecting a record / marking an issue: just toggle the
// active/issue/reviewed border classes on already-built thumb cards, no
// re-decode of any image.
function updateGalleryHighlights() {
  galleryThumbMap.forEach(({ card, record }) => {
    card.className = thumbClassName(record);
  });
}

// Re-draw only thumbnails that have already been decoded once (bitmap is
// cached, so this is cheap) after a view-mode or class-visibility change.
function redrawVisibleThumbs() {
  galleryThumbMap.forEach(({ canvas, record }) => {
    if (canvas.dataset.rendered) drawThumbCanvas(record, canvas);
  });
}

async function drawThumbCanvas(record, canvas) {
  const ctx = canvas.getContext('2d');
  if (!record.imageFile) {
    canvas.width = 360;
    canvas.height = Math.round(360 * 0.62);
    ctx.fillStyle = '#2c2a3d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ffffff';
    ctx.font = '18px sans-serif';
    ctx.fillText('NO IMAGE', 18, 34);
    return;
  }
  const bitmap = await loadThumbBitmap(record.imageFile);
  if (!bitmap) return;
  const w = bitmap.width, h = bitmap.height;
  canvas.width = w;
  canvas.height = h;
  ctx.drawImage(bitmap, 0, 0, w, h);
  drawBoxes(ctx, record, w, h, record.imageSize?.width || w, record.imageSize?.height || h, false);
}

// Downscaled, decoded-once thumbnail bitmap per file. createImageBitmap with
// resize options decodes directly at thumbnail resolution instead of
// decoding the full-resolution image and scaling it down on every draw.
function loadThumbBitmap(file) {
  if (thumbBitmapCache.has(file)) return thumbBitmapCache.get(file);
  const promise = (async () => {
    if (window.createImageBitmap) {
      try {
        const full = await createImageBitmap(file);
        const scale = Math.min(1, 360 / full.width);
        const w = Math.max(1, Math.round(full.width * scale));
        const h = Math.max(1, Math.round(full.height * scale));
        const resized = await createImageBitmap(full, { resizeWidth: w, resizeHeight: h, resizeQuality: 'medium' });
        full.close();
        return resized;
      } catch (e) {
        // fall through to <img> based decoding below
      }
    }
    // Fallback for browsers without createImageBitmap: decode via <img>, then
    // bake a small offscreen canvas so we still hand back a thumbnail-sized
    // drawable instead of a full-resolution image.
    const img = await loadImage(file);
    const scale = Math.min(1, 360 / img.naturalWidth);
    const w = Math.max(1, Math.round(img.naturalWidth * scale));
    const h = Math.max(1, Math.round(img.naturalHeight * scale));
    const off = document.createElement('canvas');
    off.width = w;
    off.height = h;
    off.getContext('2d').drawImage(img, 0, 0, w, h);
    return off;
  })();
  thumbBitmapCache.set(file, promise);
  return promise;
}

function selectRecord(index) {
  if (index < 0 || index >= records.length) return;
  currentIndex = index;
  activeBoxIndex = -1;
  issueTarget = null;
  selectedBoxIndices.clear();
  loadIssueToForm();
  renderIssuesList();
  updateGalleryHighlights();
  updatePosCounter();
  renderCurrent();
  prefetchNeighbors(index);
}

function updatePosCounter() {
  const counter = document.getElementById('posCounter');
  const record = records[currentIndex];
  if (record && reviewQueue.length && reviewPos >= 0) {
    counter.textContent = `${reviewPos + 1} / ${reviewQueue.length}`;
  } else if (record) {
    counter.textContent = `${currentIndex + 1} / ${records.length}`;
  } else {
    counter.textContent = '';
  }
  document.getElementById('navPrevBtn').disabled = !hasPrevItem();
  document.getElementById('navNextBtn').disabled = !hasNextItem();
}

function ensureReviewQueue() {
  if (!reviewQueue.length) {
    reviewQueue = filteredRecords();
    reviewPos = reviewQueue.indexOf(records[currentIndex]);
  }
}

function hasPrevItem() {
  ensureReviewQueue();
  return reviewPos > 0;
}

function hasNextItem() {
  ensureReviewQueue();
  return reviewPos >= 0 && reviewPos < reviewQueue.length - 1;
}

function prevItem() {
  ensureReviewQueue();
  if (reviewPos > 0) {
    reviewPos--;
    selectRecord(records.indexOf(reviewQueue[reviewPos]));
  }
}

function nextItem() {
  ensureReviewQueue();
  if (reviewPos >= 0 && reviewPos < reviewQueue.length - 1) {
    reviewPos++;
    selectRecord(records.indexOf(reviewQueue[reviewPos]));
  }
}

function prefetchNeighbors(index) {
  ensureReviewQueue();
  [reviewPos - 1, reviewPos + 1].forEach(p => {
    const record = reviewQueue[p];
    if (record && record.imageFile) loadImage(record.imageFile).catch(() => {});
  });
}

function enterReviewMode() {
  document.getElementById('viewerPanel').classList.add('viewer-fullscreen');
    document.getElementById('fullscreenToggleBtn').textContent = 'CLOSE';
  document.body.style.overflow = 'hidden';
}

function exitReviewMode() {
  const panel = document.getElementById('viewerPanel');
  if (!panel.classList.contains('viewer-fullscreen')) return;
  panel.classList.remove('viewer-fullscreen');
    document.getElementById('fullscreenToggleBtn').textContent = 'FOCUS';
  document.body.style.overflow = '';
}

function toggleReviewMode() {
  if (document.getElementById('viewerPanel').classList.contains('viewer-fullscreen')) exitReviewMode();
  else {
    ensureReviewQueue();
    enterReviewMode();
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeConsistencyBoard(); closeCompareView(); exitReviewMode(); return; }
  const tag = document.activeElement ? document.activeElement.tagName : '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  const key = e.key.toLowerCase();
  if (key === 'h' && !e.repeat) { e.preventDefault(); toggleMainViewMode(); return; }
  if (key === 'f' || e.key === 'ArrowRight') { e.preventDefault(); nextItem(); }
  else if (key === 'd' || e.key === 'ArrowLeft') { e.preventDefault(); prevItem(); }
});

async function renderCurrent() {
  const record = records[currentIndex];
  const canvas = document.getElementById('mainCanvas');
  const boxList = document.getElementById('boxList');
  if (!record) {
    canvas.width = 1; canvas.height = 1;
    boxList.innerHTML = '';
    document.getElementById('metaTable').innerHTML = '<div class="meta-row"><div class="meta-key">FILE</div><div class="meta-val">EMPTY</div></div>';
    return;
  }
  await renderCanvas(canvas, record, 1200, true);
  magnifierImg = record.imageFile ? await loadImage(record.imageFile) : null;
  renderMeta(record);
  boxList.innerHTML = record.boxes.length ? '' : '<div class="hint">NO BOX</div>';
  const groups = new Map();
  record.boxes.forEach((box, idx) => {
    if (!groups.has(box.className)) groups.set(box.className, []);
    groups.get(box.className).push({ box, idx });
  });
  groups.forEach((items, className) => {
    const row = document.createElement('div');
    row.className = 'box-row';
    row.title = className;
    row.innerHTML = `<span class="swatch" style="background:${classColors[className] || '#a8a4bd'}"></span><span class="box-class-once">${escapeHtml(className)}</span><div class="btn-row"></div>`;
    const actions = row.querySelector('.btn-row');
    items.forEach(({ idx }) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = String(idx + 1);
      btn.title = `${idx + 1}. ${className}`;
      btn.classList.toggle('active', selectedBoxIndices.has(idx));
      btn.addEventListener('mouseenter', () => {
        activeBoxIndex = idx;
        renderCanvas(document.getElementById('mainCanvas'), record, 1200, true);
      });
      btn.addEventListener('mouseleave', () => {
        activeBoxIndex = -1;
        renderCanvas(document.getElementById('mainCanvas'), record, 1200, true);
      });
      btn.addEventListener('click', () => {
        if (selectedBoxIndices.has(idx)) selectedBoxIndices.delete(idx);
        else selectedBoxIndices.add(idx);
        issueTarget = null;
        renderCurrent();
      });
      actions.appendChild(btn);
    });
    boxList.appendChild(row);
  });
}
