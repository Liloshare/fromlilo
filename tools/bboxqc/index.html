async function renderCanvas(canvas, record, maxWidth, isMain = false) {
  const ctx = canvas.getContext('2d');
  if (!record.imageFile) {
    canvas.width = maxWidth;
    canvas.height = Math.round(maxWidth * 0.62);
    ctx.fillStyle = '#2c2a3d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ffffff';
    ctx.font = '18px sans-serif';
    ctx.fillText('NO IMAGE', 18, 34);
    return;
  }
  const img = await loadImage(record.imageFile);
  record.imageSize = { width: img.naturalWidth, height: img.naturalHeight };
  const scale = Math.min(1, maxWidth / img.naturalWidth);
  const w = Math.max(1, Math.round(img.naturalWidth * scale));
  const h = Math.max(1, Math.round(img.naturalHeight * scale));
  canvas.width = w;
  canvas.height = h;

  ctx.drawImage(img, 0, 0, w, h);
  if (!isMain || mainViewMode === 'overlay') {
    drawBoxes(ctx, record, w, h, img.naturalWidth, img.naturalHeight, isMain);
  }
}

function toggleMainViewMode() {
  mainViewMode = mainViewMode === 'overlay' ? 'image' : 'overlay';
  updateMainViewToggleBtn();
  renderCurrent();
}

function updateMainViewToggleBtn() {
  const btn = document.getElementById('mainViewToggleBtn');
  btn.textContent = mainViewMode === 'overlay' ? 'IMAGE' : 'OVERLAY';
  btn.classList.toggle('active', mainViewMode === 'image');
}

function drawBoxes(ctx, record, canvasW, canvasH, imgW, imgH, isMain) {
  ctx.save();
  const scaleX = canvasW / imgW;
  const scaleY = canvasH / imgH;
  const labeledClasses = new Set();
  record.boxes.forEach((box, idx) => {
    if (!visibleClasses.has(box.className)) return;
    const color = classColors[box.className] || '#a8a4bd';
    const x = (box.xc - box.bw / 2) * imgW * scaleX;
    const y = (box.yc - box.bh / 2) * imgH * scaleY;
    const bw = box.bw * imgW * scaleX;
    const bh = box.bh * imgH * scaleY;
    ctx.globalAlpha = isMain ? 0.08 : 0.14;
    ctx.fillStyle = color;
    ctx.fillRect(x, y, bw, bh);
    ctx.globalAlpha = 1;
    const canShowSelection = record === records[currentIndex];
    const isActive = canShowSelection && (idx === activeBoxIndex || selectedBoxIndices.has(idx));
    ctx.shadowColor = color;
    ctx.shadowBlur = isActive ? 16 : 10;
    const baseLineWidth = classLineWidths[box.className] || 2;
    ctx.lineWidth = isActive ? Math.min(5, baseLineWidth + 1) : baseLineWidth;
    ctx.strokeStyle = isActive ? '#ffffff' : color;
    ctx.strokeRect(x, y, bw, bh);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 0.72;
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(255,255,255,0.82)';
    ctx.strokeRect(x - 1, y - 1, bw + 2, bh + 2);
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    const shouldLabel = !labeledClasses.has(box.className);
    if (shouldLabel && (isMain || canvasW > 300)) {
      labeledClasses.add(box.className);
      const label = box.className;
      ctx.font = `${Math.max(10, Math.round(canvasW / 72))}px "Courier New", monospace`;
      const tw = ctx.measureText(label).width;
      const th = Math.max(14, Math.round(canvasW / 58));
      ctx.fillStyle = color;
      ctx.fillRect(x, Math.max(0, y - th), tw + 10, th);
      ctx.fillStyle = '#050505';
      ctx.fillText(label, x + 5, Math.max(12, y - 5));
    }
  });
  ctx.restore();
}

function drawClassBoxes(ctx, record, className, canvasW, canvasH, imgW, imgH) {
  ctx.save();
  const scaleX = canvasW / imgW;
  const scaleY = canvasH / imgH;
  record.boxes.forEach((box) => {
    if (box.className !== className) return;
    const color = classColors[box.className] || '#ffcf4a';
    const x = (box.xc - box.bw / 2) * imgW * scaleX;
    const y = (box.yc - box.bh / 2) * imgH * scaleY;
    const bw = box.bw * imgW * scaleX;
    const bh = box.bh * imgH * scaleY;
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = color;
    ctx.fillRect(x, y, bw, bh);
    ctx.globalAlpha = 1;
    ctx.shadowColor = color;
    ctx.shadowBlur = 14;
    const baseLineWidth = classLineWidths[box.className] || 2;
    ctx.lineWidth = Math.min(5, baseLineWidth + 2);
    ctx.strokeStyle = '#ffffff';
    ctx.strokeRect(x, y, bw, bh);
    ctx.shadowBlur = 0;
    ctx.lineWidth = baseLineWidth;
    ctx.strokeStyle = color;
    ctx.strokeRect(x - 3, y - 3, bw + 6, bh + 6);
  });
  ctx.restore();
}

function consistencySourceRows() {
  const queue = filteredRecords();
  const current = records[currentIndex];
  if (!current) return queue.slice(0, 8);
  const currentPos = queue.indexOf(current);
  if (currentPos < 0) return queue.slice(0, 8);
  let start = Math.max(0, currentPos - 3);
  let end = Math.min(queue.length, start + 8);
  start = Math.max(0, end - 8);
  return queue.slice(start, end);
}

async function drawConsistencyCanvas(canvas, record, className, width, height) {
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, width, height);
  if (!record?.imageFile) return;
  const img = await loadImage(record.imageFile);
  const scale = Math.min(width / img.naturalWidth, height / img.naturalHeight);
  const drawW = Math.round(img.naturalWidth * scale);
  const drawH = Math.round(img.naturalHeight * scale);
  const dx = Math.round((width - drawW) / 2);
  const dy = Math.round((height - drawH) / 2);
  ctx.drawImage(img, dx, dy, drawW, drawH);
  ctx.save();
  ctx.translate(dx, dy);
  drawClassBoxes(ctx, record, className, drawW, drawH, img.naturalWidth, img.naturalHeight);
  ctx.restore();
}

async function downloadConsistencyBoard() {
  const title = document.getElementById('consisTitleInput').value.trim() || 'CONSIS';
  const className = document.getElementById('consisClassSelect').value;
  const cols = 4;
  const rows = 2;
  const cellW = 380;
  const imageH = 238;
  const captionH = 52;
  const gap = 18;
  const pad = 28;
  const titleH = 56;
  const canvas = document.createElement('canvas');
  canvas.width = pad * 2 + cols * cellW + (cols - 1) * gap;
  canvas.height = pad * 2 + titleH + rows * (imageH + captionH) + (rows - 1) * gap;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#111111';
  ctx.font = '800 30px sans-serif';
  ctx.fillText(title, pad, pad + 34);
  ctx.font = '700 16px sans-serif';

  for (let i = 0; i < Math.min(8, consistencyRows.length); i++) {
    const record = consistencyRows[i];
    const col = i % cols;
    const row = Math.floor(i / cols);
    const x = pad + col * (cellW + gap);
    const y = pad + titleH + row * (imageH + captionH + gap);
    const off = document.createElement('canvas');
    await drawConsistencyCanvas(off, record, className, cellW, imageH);
    ctx.strokeStyle = '#d8d8d8';
    ctx.strokeRect(x, y, cellW, imageH + captionH);
    ctx.drawImage(off, x, y);
    ctx.fillStyle = '#111111';
    wrapCanvasText(ctx, record.imageFile?.name || record.baseName, x + 8, y + imageH + 22, cellW - 16, 18, 2);
  }

  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = `bbox_qc_consis_${Date.now()}.png`;
  a.click();
}

function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight, maxLines) {
  const words = String(text).split(/(\s+)/).filter(Boolean);
  let line = '';
  let lines = 0;
  for (const word of words) {
    const next = line + word;
    if (ctx.measureText(next).width > maxWidth && line) {
      ctx.fillText(line.trim(), x, y + lines * lineHeight);
      lines++;
      line = word;
      if (lines >= maxLines) return;
    } else {
      line = next;
    }
  }
  if (line && lines < maxLines) ctx.fillText(line.trim(), x, y + lines * lineHeight);
}

const MAGNIFIER_SIZE = 220;
const MAGNIFIER_ZOOM = 1.5;

function initMagnifier() {
  const canvas = document.getElementById('mainCanvas');
  const lens = document.getElementById('magnifier');
  canvas.addEventListener('mouseenter', () => {
    if (magnifierImg) lens.classList.remove('hidden');
  });
  canvas.addEventListener('mousemove', (e) => {
    if (magnifierImg) drawMagnifier(e.clientX, e.clientY);
  });
  canvas.addEventListener('mouseleave', () => lens.classList.add('hidden'));
}

function drawMagnifier(clientX, clientY) {
  const canvas = document.getElementById('mainCanvas');
  const record = records[currentIndex];
  if (!record || !magnifierImg) return;
  const rect = canvas.getBoundingClientRect();
  const dispX = clientX - rect.left;
  const dispY = clientY - rect.top;
  if (dispX < 0 || dispY < 0 || dispX > rect.width || dispY > rect.height) {
    document.getElementById('magnifier').classList.add('hidden');
    return;
  }

  const imgW = magnifierImg.naturalWidth, imgH = magnifierImg.naturalHeight;
  const origX = (dispX / rect.width) * imgW;
  const origY = (dispY / rect.height) * imgH;
  const cropW = Math.min(imgW, MAGNIFIER_SIZE / MAGNIFIER_ZOOM);
  const cropH = Math.min(imgH, MAGNIFIER_SIZE / MAGNIFIER_ZOOM);
  const sx = Math.max(0, Math.min(origX - cropW / 2, imgW - cropW));
  const sy = Math.max(0, Math.min(origY - cropH / 2, imgH - cropH));

  const lensCanvas = document.getElementById('magnifierCanvas');
  lensCanvas.width = MAGNIFIER_SIZE;
  lensCanvas.height = MAGNIFIER_SIZE;
  const ctx = lensCanvas.getContext('2d');
  ctx.clearRect(0, 0, MAGNIFIER_SIZE, MAGNIFIER_SIZE);
  ctx.drawImage(magnifierImg, sx, sy, cropW, cropH, 0, 0, MAGNIFIER_SIZE, MAGNIFIER_SIZE);
  if (mainViewMode === 'overlay') {
    drawLensBoxes(ctx, record, sx, sy, cropW, cropH, imgW, imgH);
  }

  // Centered directly above the cursor (with a small gap) so it's easy to
  // read without hunting for it elsewhere on screen; flips below the cursor
  // near the top edge, and clamps horizontally so it never runs offscreen.
  const lens = document.getElementById('magnifier');
  const gap = 14;
  let left = clientX - MAGNIFIER_SIZE / 2;
  left = Math.max(8, Math.min(left, window.innerWidth - MAGNIFIER_SIZE - 8));
  let top = clientY - MAGNIFIER_SIZE - gap;
  if (top < 8) top = clientY + gap;
  lens.style.left = `${left}px`;
  lens.style.top = `${top}px`;
  lens.classList.remove('hidden');
}

function drawLensBoxes(ctx, record, sx, sy, cropW, cropH, imgW, imgH) {
  ctx.save();
  const scaleX = MAGNIFIER_SIZE / cropW;
  const scaleY = MAGNIFIER_SIZE / cropH;
  record.boxes.forEach((box, idx) => {
    if (!visibleClasses.has(box.className)) return;
    const color = classColors[box.className] || '#a8a4bd';
    const x = ((box.xc - box.bw / 2) * imgW - sx) * scaleX;
    const y = ((box.yc - box.bh / 2) * imgH - sy) * scaleY;
    const w = box.bw * imgW * scaleX;
    const h = box.bh * imgH * scaleY;
    const isActive = idx === activeBoxIndex || selectedBoxIndices.has(idx);
    ctx.shadowColor = color;
    ctx.shadowBlur = isActive ? 14 : 9;
    const baseLineWidth = classLineWidths[box.className] || 2;
    ctx.lineWidth = isActive ? Math.min(5, baseLineWidth + 1) : baseLineWidth;
    ctx.strokeStyle = isActive ? '#ffffff' : color;
    ctx.strokeRect(x, y, w, h);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 0.72;
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(255,255,255,0.82)';
    ctx.strokeRect(x - 1, y - 1, w + 2, h + 2);
    ctx.globalAlpha = 1;
  });
  ctx.restore();
}
initMagnifier();

function renderMeta(record) {
  const rows = [
    ['NO', record.order ? `${record.order} / ${reviewableTotal}` : '-'],
    ['FILE', record.baseName],
    ['SIZE', record.imageSize ? `${record.imageSize.width} x ${record.imageSize.height}` : '-'],
    ['BOX', String(record.boxes.length)]
  ].map(([k, v]) => `<div class="meta-row"><div class="meta-key">${k}</div><div class="meta-val">${escapeHtml(v)}</div><button class="meta-copy" type="button" data-copy="${escapeHtml(v)}">COPY</button></div>`).join('');

  let dupRow = '';
  if (isDuplicate(record)) {
    const parts = [];
    if (record.duplicateImages > 0) parts.push(`IMG DUP ${record.duplicateImages + 1}`);
    if (record.labelVariants) {
      const variantText = record.labelVariants.map(v => `${escapeHtml(v.source)}: ${v.boxCount} BOX`).join('<br>');
      parts.push(variantText);
    }
    const copyText = parts.map(part => part.replace(/<br>/g, '\n').replace(/<[^>]*>/g, '')).join('\n');
    dupRow = `<div class="meta-row"><div class="meta-key">DUP</div><div class="meta-val">${parts.join('<br>')}</div><button class="meta-copy" type="button" data-copy="${escapeHtml(copyText)}">COPY</button></div>`;
  }

  document.getElementById('metaTable').innerHTML = rows + dupRow;
  document.querySelectorAll('#metaTable [data-copy]').forEach(btn => {
    btn.addEventListener('click', () => copyText(btn.dataset.copy || ''));
  });
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const input = document.createElement('textarea');
    input.value = text;
    document.body.appendChild(input);
    input.select();
    document.execCommand('copy');
    input.remove();
  }
}

function buildIssueChecks() {
  const wrap = document.getElementById('issueChecks');
  wrap.innerHTML = '';
  ISSUE_TYPES.forEach(([value, label]) => {
    const item = document.createElement('label');
    item.className = 'check';
    item.innerHTML = `<input type="checkbox" value="${value}" onchange="updateCurrentIssue()"> ${label}`;
    wrap.appendChild(item);
  });
}
buildIssueChecks();

function updateMissingClassVisibility() {
  const needsClass = Array.from(document.querySelectorAll('#issueChecks input:checked')).some(input => input.value === 'missing' || input.value === 'unnecessary');
  document.getElementById('missingClassField').classList.toggle('hidden', !needsClass);
}

function loadIssueToForm() {
  const record = records[currentIndex];
  const issue = record ? getRecordIssue(record) : null;
  const entry = issue?.issues?.find(item => item.targetKey === targetKey(issueTarget)) || null;
  document.querySelectorAll('#issueChecks input').forEach(input => input.checked = entry?.types?.includes(input.value) || false);
  setSelectedActionClasses(entry?.missingClass || '');
  document.getElementById('noteInput').value = entry?.note || '';
  updateMissingClassVisibility();
}

function getSelectedActionClasses() {
  return Array.from(document.querySelectorAll('#actionClassChecks input:checked')).map(input => input.value).filter(Boolean);
}

function setSelectedActionClasses(value) {
  const values = new Set(String(value || '').split('|').filter(Boolean));
  Array.from(document.querySelectorAll('#actionClassChecks input')).forEach(input => {
    input.checked = values.has(input.value);
  });
}

function updateCurrentIssue() {
  const record = records[currentIndex];
  if (!record) return;
  updateMissingClassVisibility();
  const types = Array.from(document.querySelectorAll('#issueChecks input:checked')).map(i => i.value);
  if (types.includes('consis')) {
    openConsistencyBoard();
    return;
  }
  const actionClasses = getSelectedActionClasses();
  const note = document.getElementById('noteInput').value.trim();
  const needsClass = types.some(type => type === 'missing' || type === 'unnecessary');
  if (needsClass) return;
  const target = buildCurrentIssueTarget(record);

  if (!types.length && !note) {
    removeIssue(record.id, targetKey(target));
    return;
  }

  upsertIssue(record, {
    target,
    targetKey: targetKey(target),
    targetLabel: targetLabel(target),
    types,
    missingClass: actionClasses.join('|'),
    note
  });
  renderStats();
  renderIssuesList();
  updateGalleryHighlights();
  resetIssueDraft();
  renderCurrent();
}

function applyActionClassIssue() {
  const record = records[currentIndex];
  if (!record) return;
  const types = Array.from(document.querySelectorAll('#issueChecks input:checked')).map(i => i.value);
  const actionTypes = types.filter(type => type === 'missing' || type === 'unnecessary');
  const actionClasses = getSelectedActionClasses();
  const note = document.getElementById('noteInput').value.trim();
  if (!actionTypes.length || !actionClasses.length) return;
  const target = buildCurrentIssueTarget(record);
  upsertIssue(record, {
    target,
    targetKey: targetKey(target),
    targetLabel: targetLabel(target),
    types,
    missingClass: actionClasses.join('|'),
    note
  });
  renderStats();
  renderIssuesList();
  updateGalleryHighlights();
  resetIssueDraft();
  renderCurrent();
}

function buildCurrentIssueTarget(record) {
  if (issueTarget) return issueTarget;
  const boxIndices = Array.from(selectedBoxIndices).sort((a, b) => a - b);
  if (!boxIndices.length) return { type: 'image' };
  if (boxIndices.length === 1) {
    const idx = boxIndices[0];
    return { type: 'box', boxIndex: idx, className: record.boxes[idx]?.className };
  }
  return { type: 'boxes', boxIndices, className: boxIndices.map(idx => record.boxes[idx]?.className).filter(Boolean).join(', ') };
}

function resetIssueDraft() {
  issueTarget = null;
  selectedBoxIndices.clear();
  activeBoxIndex = -1;
  document.querySelectorAll('#issueChecks input').forEach(input => input.checked = false);
  setSelectedActionClasses('');
  document.getElementById('noteInput').value = '';
  updateMissingClassVisibility();
}

function markOk() {
  const record = records[currentIndex];
  if (!record) return;
  const hasDraftType = Array.from(document.querySelectorAll('#issueChecks input:checked')).length > 0;
  const hasDraftNote = document.getElementById('noteInput').value.trim();
  if (hasDraftType || hasDraftNote || getSelectedActionClasses().length) {
    const types = Array.from(document.querySelectorAll('#issueChecks input:checked')).map(i => i.value);
    if (types.includes('consis')) {
      openConsistencyBoard();
      return;
    }
    const needsClass = types.some(type => type === 'missing' || type === 'unnecessary');
    if (!needsClass || getSelectedActionClasses().length) {
      if (needsClass) applyActionClassIssue();
      else updateCurrentIssue();
    }
  }
  reviewedSet.add(record.id);
  saveReviewResult(record, actionFromIssue(getRecordIssue(record)) || 'approved', getRecordIssue(record));
  resetIssueDraft();
  renderStats();
  renderIssuesList();
  updateGalleryHighlights();
  renderCurrent();
}

function clearCurrentIssue() {
  const record = records[currentIndex];
  if (!record) return;
  issueMap.delete(record.id);
  reviewedSet.delete(record.id);
  issueTarget = null;
  activeBoxIndex = -1;
  selectedBoxIndices.clear();
  saveReviewResult(record, 'cleared');
  loadIssueToForm();
  renderStats();
  renderIssuesList();
  updateGalleryHighlights();
  renderCurrent();
}

function renderIssuesList() {
  const list = document.getElementById('issuesList');
  const record = records[currentIndex];
  const rows = record ? (getRecordIssue(record)?.issues || []) : [];
  if (!rows.length) {
    list.innerHTML = '<div class="hint">NO ISSUE</div>';
    return;
  }
  list.innerHTML = rows.map(issue => `
    <div class="issue-row">
      <div class="issue-row-main">
        <strong>${escapeHtml(issue.targetLabel || 'IMAGE')}</strong>
        <span>${escapeHtml(formatIssueTypes(issue.types || [])) || '-'} ${issue.missingClass ? ' / MISSING: ' + escapeHtml(issue.missingClass) : ''}</span>
        ${issue.note ? `<span>${escapeHtml(issue.note)}</span>` : ''}
      </div>
      <div class="issue-actions">
        <button type="button" data-edit-issue="${escapeHtml(issue.targetKey)}" title="EDIT">✎</button>
        <button type="button" data-delete-issue="${escapeHtml(issue.targetKey)}" title="DELETE">×</button>
      </div>
    </div>
  `).join('');
  list.querySelectorAll('[data-delete-issue]').forEach(btn => {
    btn.addEventListener('click', () => removeIssue(record.id, btn.dataset.deleteIssue));
  });
  list.querySelectorAll('[data-edit-issue]').forEach(btn => {
    btn.addEventListener('click', () => {
      const entry = rows.find(item => item.targetKey === btn.dataset.editIssue);
      if (!entry) return;
      issueTarget = entry.target || { type: 'image' };
      selectedBoxIndices.clear();
      if (issueTarget.type === 'box') selectedBoxIndices.add(issueTarget.boxIndex);
      if (issueTarget.type === 'boxes') issueTarget.boxIndices.forEach(idx => selectedBoxIndices.add(idx));
      activeBoxIndex = issueTarget.type === 'box' ? issueTarget.boxIndex : -1;
      loadIssueToForm();
      renderCurrent();
      document.getElementById('noteInput').focus();
    });
  });
}
renderIssuesList();

function formatIssueTypes(types) {
  const labels = {
    wrong_class: 'WRONG CLASS',
    wrong_box: 'SIZE',
    consis: 'CONSIS',
    missing: 'MISSING',
    unnecessary: 'DELETE',
    duplicate: 'DUPLICATE'
  };
  return types.map(type => labels[type] || type).join(', ');
}

function issueTypeLabel(type) {
  return (ISSUE_TYPES.find(([value]) => value === type) || [type, type])[1];
}

function issueTargetText(issue) {
  const label = issue.targetLabel || 'IMAGE';
  if (!issue.targetKey || issue.targetKey === 'image' || label === 'IMAGE') return '이미지 전체';
  return label;
}

function issueMatrixCell(issues, type) {
  const values = issues
    .filter(issue => (issue.types || []).includes(type))
    .map(issue => {
      const parts = [issueTargetText(issue)];
      if (issue.missingClass) parts.push(issue.missingClass);
      if (issue.note) parts.push(issue.note);
      return parts.join(' / ');
    });
  return Array.from(new Set(values)).join('\n');
}

function buildIssueMatrixRows() {
  const issueTypes = ISSUE_TYPES.map(([value]) => value);
  const rows = [['file', ...issueTypes.map(issueTypeLabel)]];
  Array.from(issueMap.values())
    .sort((a, b) => String(a.file || '').localeCompare(String(b.file || ''), 'ko', { numeric: true, sensitivity: 'base' }))
    .forEach(group => {
      const issues = group.issues || [];
      if (!issues.length) return;
      rows.push([
        group.file || '',
        ...issueTypes.map(type => issueMatrixCell(issues, type))
      ]);
    });
  return rows;
}

// Only images that actually carry label data are worth a row in the QC
// export \u2014 matching what the gallery shows. missing-image/missing-label/
// zero-box counts are still surfaced as summary numbers (see exportJson)
// instead of drowning the useful rows in thousands of source-photo noise.
function reviewableRecords() {
  return records.filter(r => r.status === 'matched' && r.boxes.length > 0 && !isDuplicate(r));
}

// ---------------------------------------------------------------------
// Minimal, dependency-free .xlsx writer. An xlsx is a ZIP archive of OOXML
// parts; we only need a handful of them, and by storing entries uncompressed
// (ZIP "store" method) we can skip implementing DEFLATE entirely while still
// producing a file real Excel/Numbers/Sheets opens correctly with multiple
// named sheets/tabs.
// ---------------------------------------------------------------------

function xlsxColumnName(index) {
  let s = '';
  let n = index + 1;
  while (n > 0) {
    const rem = (n - 1) % 26;
    s = String.fromCharCode(65 + rem) + s;
    n = Math.floor((n - 1) / 26);
  }
  return s;
}

function xmlEscape(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[ch]));
}

function buildSheetXml(rows) {
  const rowsXml = rows.map((row, ri) => {
    const cells = row.map((val, ci) => {
      const ref = xlsxColumnName(ci) + (ri + 1);
      if (typeof val === 'number' && Number.isFinite(val)) {
        return `<c r="${ref}"><v>${val}</v></c>`;
      }
      return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlEscape(val)}</t></is></c>`;
    }).join('');
    return `<row r="${ri + 1}">${cells}</row>`;
  }).join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${rowsXml}</sheetData></worksheet>`;
}

function buildWorkbookXml(sheetNames) {
  const sheetsXml = sheetNames.map((name, i) => `<sheet name="${xmlEscape(name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheetsXml}</sheets></workbook>`;
}

function buildWorkbookRelsXml(sheetNames) {
  const rels = sheetNames.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${rels}</Relationships>`;
}

function buildContentTypesXml(sheetNames) {
  const overrides = sheetNames.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${overrides}</Types>`;
}

const XLSX_ROOT_RELS_XML = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';

const CRC32_TABLE = (() => {
  const table = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    table[n] = c >>> 0;
  }
  return table;
})();

function crc32(bytes) {
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) crc = CRC32_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

// Builds an uncompressed (store-method) ZIP from [{name, data: Uint8Array}].
function buildZip(files) {
  const localParts = [];
  const centralParts = [];
  let offset = 0;

  files.forEach(file => {
    const nameBytes = new TextEncoder().encode(file.name);
    const data = file.data;
    const crc = crc32(data);
    const size = data.length;

    const localHeader = new Uint8Array(30 + nameBytes.length);
    const lv = new DataView(localHeader.buffer);
    lv.setUint32(0, 0x04034b50, true);
    lv.setUint16(4, 20, true);
    lv.setUint16(6, 0, true);
    lv.setUint16(8, 0, true);
    lv.setUint16(10, 0, true);
    lv.setUint16(12, 0, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, size, true);
    lv.setUint32(22, size, true);
    lv.setUint16(26, nameBytes.length, true);
    lv.setUint16(28, 0, true);
    localHeader.set(nameBytes, 30);
    localParts.push(localHeader, data);

    const centralHeader = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(centralHeader.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, 0, true);
    cv.setUint16(14, 0, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, size, true);
    cv.setUint32(24, size, true);
    cv.setUint16(28, nameBytes.length, true);
    cv.setUint16(30, 0, true);
    cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true);
    cv.setUint16(36, 0, true);
    cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    centralHeader.set(nameBytes, 46);
    centralParts.push(centralHeader);

    offset += localHeader.length + data.length;
  });

  const centralSize = centralParts.reduce((s, p) => s + p.length, 0);
  const centralOffset = offset;

  const end = new Uint8Array(22);
  const ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(4, 0, true);
  ev.setUint16(6, 0, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, centralSize, true);
  ev.setUint32(16, centralOffset, true);
  ev.setUint16(20, 0, true);

  return new Blob([...localParts, ...centralParts, end], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

// sheets: [{ name, rows: [[cell, ...], ...] }]
function downloadXlsx(sheets, filename) {
  const encoder = new TextEncoder();
  const sheetNames = sheets.map(s => s.name);
  const files = [
    { name: '[Content_Types].xml', data: encoder.encode(buildContentTypesXml(sheetNames)) },
    { name: '_rels/.rels', data: encoder.encode(XLSX_ROOT_RELS_XML) },
    { name: 'xl/workbook.xml', data: encoder.encode(buildWorkbookXml(sheetNames)) },
    { name: 'xl/_rels/workbook.xml.rels', data: encoder.encode(buildWorkbookRelsXml(sheetNames)) },
    ...sheets.map((s, i) => ({ name: `xl/worksheets/sheet${i + 1}.xml`, data: encoder.encode(buildSheetXml(s.rows)) }))
  ];
  const blob = buildZip(files);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function exportCsv() {
  const issueMatrixRows = buildIssueMatrixRows();
  const mainHeader = ['order', 'file', 'box_count', 'reviewed', 'issue_types', 'missing_class', 'note'];
  const mainRows = [mainHeader];
  reviewableRecords().forEach(record => {
    const issue = summarizeIssue(issueMap.get(record.id));
    mainRows.push([
      record.order,
      record.baseName,
      record.boxes.length,
      isReviewed(record) ? 'yes' : 'no',
      formatIssueTypes(issue.types ? issue.types.split('|') : []),
      issue.missingClass || '',
      issue.note || ''
    ]);
  });

  const dupHeader = ['file', 'variants', 'reviewed', 'issue_types', 'missing_class', 'note'];
  const dupRows = [dupHeader];
  records.filter(r => r.status === 'matched' && isDuplicate(r)).forEach(record => {
    const issue = summarizeIssue(issueMap.get(record.id));
    const variants = (record.labelVariants || []).map(v => `${v.source}:${v.boxCount}\ubc15\uc2a4`).join(' | ');
    dupRows.push([
      record.baseName,
      variants,
      isReviewed(record) ? 'yes' : 'no',
      formatIssueTypes(issue.types ? issue.types.split('|') : []),
      issue.missingClass || '',
      issue.note || ''
    ]);
  });

  const issueHeader = ['file', 'target', 'issue_types', 'missing_class', 'note', 'box_count', 'status'];
  const issueRows = [issueHeader];
  Array.from(issueMap.values())
    .sort((a, b) => String(a.file || '').localeCompare(String(b.file || ''), 'ko', { numeric: true, sensitivity: 'base' }))
    .forEach(group => {
      (group.issues || []).forEach(issue => {
        issueRows.push([
          group.file || '',
          issue.targetLabel || 'IMAGE',
          formatIssueTypes(issue.types || []),
          issue.missingClass || '',
          issue.note || '',
          group.boxCount ?? '',
          group.status || ''
        ]);
      });
    });

  downloadXlsx([
    { name: '\uc774\uc288\uccb4\ud06c', rows: issueMatrixRows },
    { name: '\uac80\uc218\uacb0\uacfc', rows: mainRows },
    { name: '\uc774\uc288\uc0c1\uc138', rows: issueRows },
    { name: '\uc911\ubcf5\ud30c\uc77c\uba85', rows: dupRows }
  ], 'bbox_qc_result.xlsx');
}

function exportJson() {
  const reviewable = reviewableRecords();
  const issueCount = Array.from(issueMap.values()).reduce((sum, issue) => sum + (issue.issues?.length || (issue.types?.length ? 1 : 0)), 0);
  const payload = {
    exportedAt: new Date().toISOString(),
    summary: {
      images: imageFiles.length,
      labels: labelFiles.length,
      matched: records.filter(r => r.status === 'matched').length,
      reviewable: reviewable.length,
      zeroBox: records.filter(r => r.status === 'matched' && r.boxes.length === 0 && !isDuplicate(r)).length,
      duplicateFilenames: records.filter(r => r.status === 'matched' && isDuplicate(r)).length,
      boxes: records.reduce((sum, r) => sum + r.boxes.length, 0),
      issues: issueCount,
      reviewed: reviewable.filter(isReviewed).length
    },
    records: reviewable.map(r => ({
      order: r.order,
      file: r.baseName,
      boxCount: r.boxes.length,
      reviewed: isReviewed(r),
      ...(issueMap.get(r.id) || {})
    })),
    unreviewedFiles: reviewable.filter(r => !isReviewed(r)).map(r => r.baseName),
    zeroBoxFiles: records.filter(r => r.status === 'matched' && r.boxes.length === 0 && !isDuplicate(r)).map(r => r.baseName),
    duplicateFiles: records.filter(r => r.status === 'matched' && isDuplicate(r)).map(r => ({
      file: r.baseName,
      duplicateImages: r.duplicateImages,
      duplicateLabels: r.duplicateLabels,
      labelVariants: r.labelVariants
    })),
    missingImages: records.filter(r => r.status === 'missing-image').map(r => r.baseName),
    missingLabels: records.filter(r => r.status === 'missing-label').map(r => r.baseName)
  };
  downloadBlob(JSON.stringify(payload, null, 2), 'bbox_qc_result.json', 'application/json;charset=utf-8');
}

function downloadBlob(content, name, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  a.click();
  URL.revokeObjectURL(url);
}

function loadImage(file) {
  if (mainImageCache.has(file)) return mainImageCache.get(file);
  const promise = new Promise((resolve, reject) => {
    if (!objectUrlCache.has(file)) objectUrlCache.set(file, URL.createObjectURL(file));
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = objectUrlCache.get(file);
  });
  mainImageCache.set(file, promise);
  return promise;
}

function statusLabel(record) {
  if (record.status === 'missing-image') return 'NO IMG';
  if (record.status === 'missing-label') return 'NO LBL';
  if (record.duplicateImages || record.duplicateLabels) return 'DUP';
  if (record.parseError) return 'LBL ERR';
  return 'MATCH';
}

function resetAll() {
  exitReviewMode();
  closeCompareView();
  classFilter = '__all__';
  reviewableTotal = 0;
  mainViewMode = 'overlay';
  magnifierImg = null;
  updateMainViewToggleBtn();
  objectUrlCache.forEach(url => URL.revokeObjectURL(url));
  objectUrlCache.clear();
  if (galleryObserver) galleryObserver.disconnect();
  galleryThumbMap.clear();
  mainImageCache = new Map();
  thumbBitmapCache = new Map();
  reviewQueue = [];
  reviewPos = -1;

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}
