<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joseon BBox QC</title>
  <style>
    :root {
      --bg: #f3f0fb;
      --panel: #ffffff;
      --text: #4a4560;
      --muted: #948fb3;
      --line: #e6e1f5;
      --soft: #f6f3fc;
      --ink: #55506e;
      --accent: #6b84dc;
      --accent-2: #4fa38c;
      --danger: #d1637d;
      --warn: #c98a3e;
      --ok: #4f9d6e;
      --dark: #2c2a3d;
      --dark-rgb: 44, 42, 61;
      --radius: 8px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
    }

    .app {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
    }

    header {
      background: #5d5a86;
      color: white;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }

    h1 {
      font-size: 18px;
      line-height: 1.2;
      margin: 0;
      font-weight: 800;
      letter-spacing: 0;
    }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 12px;
      color: rgba(255,255,255,0.78);
    }

    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 12px;
      padding: 12px;
      min-height: 0;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      min-height: 0;
      overflow: hidden;
    }

    .panel-head {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: #f9f6fd;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .panel-title {
      font-size: 13px;
      font-weight: 800;
    }

    .panel-body {
      padding: 14px;
      overflow: auto;
      max-height: calc(100vh - 70px);
    }

    .stack { display: grid; gap: 12px; }

    .field { display: grid; gap: 6px; }
    .field label {
      font-size: 12px;
      font-weight: 800;
      color: #55506e;
    }

    input[type="file"] { display: none; }

    .drop {
      border: 1px dashed #c3bcdb;
      background: #f8f5fc;
      border-radius: var(--radius);
      padding: 14px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .drop:hover { border-color: var(--accent); background: #eaeefb; }
    .drop.loaded { border-color: var(--ok); background: #eaf6ef; }
    .drop strong { display: block; font-size: 13px; margin-bottom: 4px; }
    .drop span { display: block; color: var(--muted); font-size: 12px; line-height: 1.35; }

    textarea, select, input[type="text"], input[type="number"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: white;
      color: var(--text);
      font: inherit;
      font-size: 13px;
      padding: 8px 10px;
    }
    textarea { min-height: 92px; resize: vertical; }

    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      min-height: 34px;
    }
    button:hover { background: #f8f5fc; }
    button.primary { background: var(--accent); color: white; border-color: var(--accent); }
    button.primary:hover { background: #5570c9; }
    button.success { background: var(--accent-2); color: white; border-color: var(--accent-2); }
    button.danger { background: #fbeef1; color: var(--danger); border-color: #eec4d0; }
    button:disabled { opacity: .45; cursor: not-allowed; }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .stat {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      background: var(--soft);
    }
    .stat .num { font-size: 20px; font-weight: 900; line-height: 1; }
    .stat .label { color: var(--muted); font-size: 11px; margin-top: 4px; font-weight: 700; }
    .num.ok { color: var(--ok); }
    .num.warn { color: var(--warn); }
    .num.err { color: var(--danger); }

    .swatch { width: 18px; height: 18px; border-radius: 4px; border: 1px solid rgba(0,0,0,.15); }

    .toolbar {
      display: grid;
      grid-template-columns: 200px auto;
      gap: 8px;
      padding: 10px;
      border-bottom: 1px solid var(--line);
      background: #f9f6fd;
      align-items: center;
    }

    .class-chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      background: #f9f6fd;
    }
    .class-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: white;
      color: var(--ink);
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      min-height: 0;
    }
    .class-chip:hover { border-color: var(--accent); }
    .class-chip.active { background: #e1e6fa; border-color: var(--accent); color: #5570c9; }
    .class-chip .chip-swatch {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex: 0 0 auto;
    }


    .gallery-wrap {
      min-height: 0;
      overflow: auto;
      height: calc(100vh - 126px);
      padding: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
    }
    .gallery-empty {
      grid-column: 1 / -1;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      padding: 40px 0;
    }

    .thumb {
      border: 2px solid transparent;
      background: white;
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      position: relative;
      box-shadow: 0 1px 2px rgba(16,24,40,.06);
    }
    .thumb:hover { border-color: #aebdf0; }
    .thumb.dup { border-color: var(--warn); }
    .thumb.zero-box { border-color: var(--muted); }
    .thumb.active { border-color: var(--accent); }
    .thumb.reviewed { border-color: var(--ok); }
    .thumb.issue { border-color: var(--danger); }
    .thumb-order {
      position: absolute;
      top: 8px;
      left: 8px;
      max-width: calc(100% - 16px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      background: rgba(var(--dark-rgb),.72);
      color: white;
      font-size: 10px;
      font-weight: 900;
      padding: 3px 7px;
      border-radius: 4px;
      z-index: 2;
    }
    .thumb.reviewed::before {
      content: "✓";
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--ok);
      color: white;
      font-size: 10px;
      font-weight: 900;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      z-index: 2;
    }
    .thumb.issue::before {
      content: "!";
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--danger);
      color: white;
      font-size: 10px;
      font-weight: 900;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      z-index: 2;
    }
    .thumb canvas {
      width: 100%;
      aspect-ratio: 16 / 10;
      display: block;
      background: var(--dark);
    }
    .thumb-foot {
      padding: 8px;
      border-top: 1px solid var(--line);
      display: grid;
      gap: 4px;
    }
    .thumb-name {
      font-size: 11px;
      line-height: 1.25;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .thumb-meta {
      font-size: 11px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .viewer {
      display: grid;
      gap: 10px;
    }
    .viewer-main { min-width: 0; position: relative; }
    .viewer-side { display: grid; gap: 10px; align-content: start; }
    .canvas-frame {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: auto;
      background: var(--dark);
      max-height: 52vh;
      display: grid;
      place-items: safe center;
    }
    #mainCanvas {
      max-width: 100%;
      height: auto;
      display: block;
      cursor: zoom-in;
    }
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      min-height: 0;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.25);
      background: rgba(var(--dark-rgb),.55);
      color: #fff;
      font-size: 20px;
      font-weight: 900;
      display: grid;
      place-items: center;
      cursor: pointer;
      z-index: 3;
    }
    .nav-arrow:hover { background: rgba(107,132,220,.85); }
    .nav-arrow:disabled { opacity: .25; cursor: not-allowed; background: rgba(var(--dark-rgb),.55); }
    .nav-prev { left: 10px; }
    .nav-next { right: 10px; }
    .pos-counter {
      font-size: 12px;
      color: var(--muted);
      font-weight: 800;
      white-space: nowrap;
    }
    #mainViewToggleBtn.active { background: #e1e6fa; color: #5570c9; border-color: var(--accent); }

    .magnifier {
      position: fixed;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: 3px solid white;
      box-shadow: 0 4px 18px rgba(0,0,0,.45), 0 0 0 1px rgba(0,0,0,.15);
      pointer-events: none;
      overflow: hidden;
      z-index: 600;
      background: var(--dark);
    }
    .magnifier canvas { width: 100%; height: 100%; display: block; }

    #viewerPanel {
      display: none;
    }
    #viewerPanel.viewer-fullscreen {
      position: fixed;
      inset: 0;
      z-index: 200;
      border-radius: 0;
      display: flex;
      flex-direction: column;
    }
    .panel.viewer-fullscreen .panel-body {
      max-height: none;
      height: 100%;
      overflow: hidden;
      padding: 12px;
    }
    .panel.viewer-fullscreen .viewer {
      grid-template-columns: 1fr 360px;
      height: 100%;
      min-height: 0;
    }
    .panel.viewer-fullscreen .viewer-main {
      height: 100%;
      display: flex;
      min-height: 0;
    }
    .panel.viewer-fullscreen .canvas-frame {
      max-height: none;
      flex: 1 1 auto;
      width: 100%;
    }
    .panel.viewer-fullscreen .viewer-side {
      overflow: auto;
      height: 100%;
      padding-right: 4px;
    }
    @media (max-width: 900px) {
      .panel.viewer-fullscreen .viewer { grid-template-columns: 1fr; grid-template-rows: 1fr auto; overflow: auto; }
      .panel.viewer-fullscreen .canvas-frame { max-height: 46vh; }
    }

    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(var(--dark-rgb),.55);
      display: grid;
      place-items: center;
      z-index: 500;
      color: white;
      font-size: 13px;
      font-weight: 800;
      gap: 12px;
    }
    .loading-overlay .spinner {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,.25);
      border-top-color: #fff;
      animation: spin .8s linear infinite;
    }
    .loading-box { display: grid; justify-items: center; gap: 10px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .compare-modal {
      position: fixed;
      inset: 0;
      z-index: 550;
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }
    .compare-head {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .compare-body {
      flex: 1 1 auto;
      overflow: auto;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 14px;
      padding: 14px;
      align-items: start;
    }
    .compare-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 14px;
      align-content: start;
    }
    .compare-issue-form {
      display: grid;
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      position: sticky;
      top: 0;
    }
    @media (max-width: 900px) {
      .compare-body { grid-template-columns: 1fr; }
    }
    .compare-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .compare-panel canvas {
      width: 100%;
      height: auto;
      display: block;
      background: var(--dark);
    }
    .compare-caption {
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 800;
      color: var(--ink);
      border-top: 1px solid var(--line);
    }

    .meta-table {
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      font-size: 12px;
    }
    .meta-row {
      display: grid;
      grid-template-columns: 92px 1fr;
      border-bottom: 1px solid var(--line);
    }
    .meta-row:last-child { border-bottom: 0; }
    .meta-key { background: var(--soft); color: var(--muted); padding: 8px; font-weight: 800; }
    .meta-val { padding: 8px; overflow-wrap: anywhere; }

    .issue-form { display: grid; gap: 10px; }
    .check-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .check {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 7px 8px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      background: white;
    }
    .check:has(input:checked) {
      border-color: #eec4d0;
      background: #fbeef1;
      color: #a94d68;
      font-weight: 800;
    }

    .box-list {
      display: grid;
      gap: 6px;
      max-height: 170px;
      overflow: auto;
    }
    .box-row {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 7px 8px;
      display: grid;
      grid-template-columns: 18px 1fr auto;
      gap: 8px;
      align-items: center;
      font-size: 12px;
    }

    .issues-list {
      display: grid;
      gap: 6px;
      max-height: 180px;
      overflow: auto;
    }
    .issue-row {
      border: 1px solid #eec4d0;
      background: #fbf2f4;
      border-radius: 6px;
      padding: 8px;
      font-size: 12px;
      display: grid;
      gap: 4px;
    }
    .issue-row strong { overflow-wrap: anywhere; }

    .hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .hidden { display: none !important; }

    @media (max-width: 1100px) {
      .layout { grid-template-columns: 1fr; }
      .panel-body { max-height: none; }
      .gallery-wrap { height: auto; }
      .toolbar { grid-template-columns: 1fr; }
    }

    :root {
      color-scheme: dark;
      --bg: #050505;
      --panel: #0a0a09;
      --text: #f3f0e8;
      --muted: #9a968c;
      --line: #2a2926;
      --soft: #12110f;
      --ink: #f3f0e8;
      --accent: #f3f0e8;
      --accent-2: #a7d7b8;
      --danger: #e58aa0;
      --warn: #d8b486;
      --ok: #a7d7b8;
      --dark: #050505;
      --dark-rgb: 5, 5, 5;
      --radius: 0;
    }

    body {
      font-family: "Courier New", Courier, "SFMono-Regular", Consolas, monospace;
      background: var(--bg);
      color: var(--text);
    }

    header,
    .panel-head,
    .toolbar,
    .class-chip-row,
    .compare-head {
      background: var(--bg);
      color: var(--text);
      border-color: var(--line);
    }

    header {
      padding: 18px 20px;
    }

    h1,
    .panel-title,
    .field label,
    button,
    .stat .num,
    .stat .label,
    .thumb-name,
    .compare-caption,
    .meta-key {
      font-weight: 400;
    }

    h1 {
      font-size: 20px;
      text-transform: uppercase;
    }

    .header-meta,
    .hint,
    .drop span,
    .thumb-meta,
    .pos-counter,
    .stat .label,
    .field label {
      color: var(--muted);
    }

    .panel,
    .stat,
    .drop,
    textarea,
    select,
    input[type="text"],
    input[type="number"],
    button,
    .class-chip,
    .thumb,
    .compare-issue-form,
    .compare-panel,
    .meta-table,
    .box-row,
    .check,
    .issue-row {
      background: var(--panel);
      color: var(--text);
      border-color: var(--line);
      border-radius: 0;
      box-shadow: none;
    }

    .drop:hover,
    button:hover,
    .class-chip:hover {
      background: #12110f;
      border-color: #5a5750;
    }

    .drop.loaded,
    .class-chip.active,
    #mainViewToggleBtn.active {
      background: #111a14;
      border-color: var(--ok);
      color: var(--ok);
    }

    button.primary {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    button.primary:hover {
      background: #ffffff;
      color: var(--bg);
    }

    button.success {
      background: transparent;
      color: var(--ok);
      border-color: var(--ok);
    }

    button.danger,
    .check:has(input:checked),
    .issue-row {
      background: #1a0f12;
      color: var(--danger);
      border-color: var(--danger);
    }

    .num.ok { color: var(--ok); }
    .num.warn { color: var(--warn); }
    .num.err { color: var(--danger); }

    .canvas-frame,
    .thumb canvas,
    .compare-panel canvas,
    .magnifier,
    .loading-overlay,
    .compare-modal {
      background: var(--bg);
    }

    .thumb:hover,
    .thumb.active {
      border-color: var(--text);
    }

    .thumb.reviewed {
      border-color: var(--ok);
    }

    .thumb.issue {
      border-color: var(--danger);
    }

    .thumb-order,
    .thumb.reviewed::before,
    .thumb.issue::before,
    .nav-arrow {
      border-radius: 0;
      background: var(--soft);
      color: var(--text);
      border: 1px solid var(--line);
    }

    .meta-key {
      background: var(--soft);
    }

    .swatch,
    .class-chip .chip-swatch {
      border-radius: 0;
    }

    .panel,
    .canvas-frame,
    .meta-table,
    .box-list,
    .issues-list,
    .compare-issue-form,
    .compare-panel {
      box-shadow: 0 0 0 1px rgba(243, 240, 232, 0.06), 0 0 18px rgba(243, 240, 232, 0.08);
    }

    .panel:hover,
    .canvas-frame:hover,
    .compare-panel:hover {
      box-shadow: 0 0 0 1px rgba(243, 240, 232, 0.18), 0 0 28px rgba(243, 240, 232, 0.14);
    }

    .class-summary {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 10px;
      box-shadow: 0 0 18px rgba(243, 240, 232, 0.08);
    }

    #classInput {
      display: none;
    }

    .class-edit-modal {
      position: fixed;
      inset: 0;
      z-index: 700;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.82);
    }

    .class-edit-box {
      width: min(720px, 100%);
      max-height: min(760px, calc(100vh - 40px));
      overflow: auto;
      border: 1px solid var(--line);
      background: var(--bg);
      box-shadow: 0 0 0 1px rgba(243, 240, 232, 0.12), 0 0 40px rgba(243, 240, 232, 0.14);
    }

    .class-edit-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px;
      border-bottom: 1px solid var(--line);
    }

    .class-edit-list {
      display: grid;
      gap: 8px;
      padding: 14px;
    }

    .class-edit-row {
      display: grid;
      grid-template-columns: 48px 18px 1fr;
      gap: 10px;
      align-items: center;
    }

    .class-edit-row code {
      color: var(--muted);
    }

    .class-edit-row input {
      min-width: 0;
    }

    .box-class-once {
      opacity: 0.68;
      font-size: 11px;
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <h1>Joseon BBox QC</h1>
    <div class="header-meta">
      <span id="statusText">IMAGE / LABEL</span>
    </div>
  </header>

  <main class="layout">
    <section class="panel">
      <div class="panel-head">
        <div class="panel-title">DATA</div>
        <button onclick="resetAll()">RESET</button>
      </div>
      <div class="panel-body stack">
        <div class="field">
          <label>IMAGE</label>
          <div class="drop" id="imageDrop">
            <strong>SELECT IMAGE</strong>
            <span>JPG / JPEG / PNG</span>
          </div>
          <input id="imageInput" type="file" webkitdirectory multiple>
        </div>

<script>
const PAGE_LIMIT = 1000;
const DEFAULT_COLORS = ['#f2867a','#6f9ce0','#5fb3a3','#f0b45c','#a685e8','#e87aa8','#6cbf7f','#5fb8cc','#ef9a5c','#8b85e8','#b3d967','#cc7070','#6ecfbe','#f5d76e','#9aa3b8'];
const ISSUE_TYPES = [
  ['wrong_class', 'CLASS'],
  ['wrong_box', 'BBOX'],
  ['missing', 'MISSING'],
  ['duplicate', 'DUP'],
  ['unnecessary', 'DELETE'],
  ['unclear', 'UNCLEAR'],
  ['zero_box_check', 'ZERO'],
  ['other', 'ETC']
];

let imageFiles = [];
let labelFiles = [];
let imageMap = new Map();
let labelMap = new Map();
let classes = [];
let classColors = {};
let visibleClasses = new Set();
let classFilter = '__all__'; // '__all__' or a single class name — which images the gallery shows
let reviewableTotal = 0; // count of matched+has-boxes records, for the stable #order badge
let mainViewMode = 'overlay'; // 'overlay' | 'image' — single-image review canvas only
let magnifierImg = null; // full-res <img> for the currently selected record, used by the lens
let records = [];
let currentIndex = -1;
let issueMap = new Map();
let reviewedSet = new Set();
let objectUrlCache = new Map();
let activeBoxIndex = -1;

// review-mode ("하나씩 넘기기") navigation queue, snapshot of the filtered list at the
// moment review mode was entered so marking a record OK/issue doesn't yank it out from
// under the user mid-session
let reviewQueue = [];
let reviewPos = -1;

let mainImageCache = new Map(); // File -> Promise<HTMLImageElement>
let thumbBitmapCache = new Map(); // File -> Promise<ImageBitmap|HTMLImageElement>
let galleryThumbMap = new Map(); // record.id -> { card, canvas }
let galleryObserver = null;
let searchDebounceTimer = null;
const userEmail = sessionStorage.getItem('fromliloUserEmail') || localStorage.getItem('fromliloUserEmail') || '';

const imageInput = document.getElementById('imageInput');
const labelInput = document.getElementById('labelInput');
const imageDrop = document.getElementById('imageDrop');
const labelDrop = document.getElementById('labelDrop');

function localFileKey(file) {
  if (!file) return '';
  return `${file.name}__${file.size}__${file.lastModified}`;
}

function recordSource(record) {
  if (record.r2Key) {
    return {
      sourceType: 'r2',
      imageKey: record.r2Key,
      imageFilename: record.imageFile?.name || record.baseName
    };
  }
  return {
    sourceType: 'local',
    imageKey: localFileKey(record.imageFile) || record.id,
    imageFilename: record.imageFile?.name || record.baseName
  };
}

function actionFromIssue(issue) {
  if (!issue) return 'approved';
  return issue.types?.length ? issue.types.join('|') : issue.missingClass ? 'missing' : issue.note ? 'note' : 'issue';
}

async function saveReviewResult(record, action, issue = null) {
  if (!record || !userEmail) return;
  const source = recordSource(record);
  const payload = {
    userEmail,
    ...source,
    annotationFilename: record.labelFile?.name || '',
    action,
    note: issue?.note || '',
    issueTypes: issue?.types || [],
    missingClass: issue?.missingClass || '',
    boxCount: record.boxes?.length || 0,
    status: record.status || ''
  };

  try {
    const response = await fetch('/api/review-result', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!response.ok) throw new Error('review_result_save_failed');
  } catch (error) {
    console.warn(error);
  }
}
const runBtn = document.getElementById('runBtn');

imageDrop.addEventListener('click', () => imageInput.click());
labelDrop.addEventListener('click', () => labelInput.click());
imageInput.addEventListener('change', e => handleImages(e.target.files));
labelInput.addEventListener('change', e => handleLabels(e.target.files));
document.getElementById('searchInput').addEventListener('input', () => {
  clearTimeout(searchDebounceTimer);
  searchDebounceTimer = setTimeout(renderGallery, 200);
});
document.getElementById('classInput').addEventListener('input', () => {
  readClassInput();
  renderClassControls();
  updateClassSummary();
  renderCurrent();
});
document.getElementById('missingClassSelect').addEventListener('change', updateCurrentIssue);

function normalizedStem(name) {
  return name.replace(/^.*[\\/]/, '').replace(/\.[^/.]+$/, '').normalize('NFC').toLowerCase();
}

function filePath(file) {
  return file.webkitRelativePath || file.name;
}

function updateClassSummary() {
  const summary = document.getElementById('classSummary');
  if (!summary) return;
  const count = document.getElementById('classInput').value
    .split(/\r?\n|,/)
    .map(s => s.trim())
    .filter(Boolean).length;
  summary.textContent = `${count} CLASS`;
}

function openClassEditor() {
  readClassInput();
  const list = document.getElementById('classEditList');
  list.innerHTML = '';
  classes.forEach((name, idx) => {
    const row = document.createElement('div');
    row.className = 'class-edit-row';
    row.innerHTML = `
      <code>${idx}</code>
      <span class="swatch" style="background:${classColors[name] || DEFAULT_COLORS[idx % DEFAULT_COLORS.length]}"></span>
      <input type="text" value="${escapeHtml(name)}" data-class-index="${idx}">
    `;
    list.appendChild(row);
  });
  document.getElementById('classEditModal').classList.remove('hidden');
}

function closeClassEditor() {
  document.getElementById('classEditModal').classList.add('hidden');
}

function applyClassEditor() {
  const previous = [...classes];
  const next = Array.from(document.querySelectorAll('#classEditList input'))
    .map(input => input.value.trim())
    .filter(Boolean);
  if (!next.length) return;

  const nextColors = {};
  next.forEach((name, idx) => {
    nextColors[name] = classColors[previous[idx]] || classColors[name] || DEFAULT_COLORS[idx % DEFAULT_COLORS.length];
  });
  classColors = nextColors;
  document.getElementById('classInput').value = next.join('\n');

  records.forEach(record => {
    record.boxes.forEach(box => {
      if (next[box.classId]) box.className = next[box.classId];
    });
    if (record.labelVariants) {
      record.labelVariants.forEach(variant => {
        variant.boxes.forEach(box => {
          if (next[box.classId]) box.className = next[box.classId];
        });
      });
    }
  });

  readClassInput();
  renderClassControls();
  populateMissingClassOptions();
  renderGallery();
  if (currentIndex >= 0) selectRecord(currentIndex);
  closeClassEditor();
}

function handleImages(files) {
  const all = Array.from(files).filter(f => /\.(jpg|jpeg|png)$/i.test(f.name));
  // If the picked folder contains an "output" subfolder (the finalized image
  // set), only match against those instead of every image under the whole
  // source tree — otherwise unrelated source images bloat the gallery.
  const outputOnly = all.filter(f => filePath(f).split(/[\\/]/).includes('output'));
  imageFiles = outputOnly.length ? outputOnly : all;
  imageDrop.classList.add('loaded');
  imageDrop.querySelector('strong').textContent = `IMG ${imageFiles.length}`;
  imageDrop.querySelector('span').textContent = outputOnly.length ? `OUTPUT / ${all.length}` : 'LOADED';
  checkReady();
}

async function handleLabels(files) {
  const all = Array.from(files);
  const yoloTxt = all.filter(f => /\.txt$/i.test(f.name) && !/^(train|test|valid|classes)\.txt$/i.test(f.name));
  const objTrainTxt = yoloTxt.filter(f => filePath(f).split(/[\\/]/).includes('obj_train_data'));
  labelFiles = objTrainTxt.length ? objTrainTxt : yoloTxt;
  const objNames = all.find(f => /obj\.names$/i.test(f.name));
  if (objNames) {
    const text = await objNames.text();
    document.getElementById('classInput').value = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean).join('\n');
    readClassInput();
    renderClassControls();
  }
  labelDrop.classList.add('loaded');
  labelDrop.querySelector('strong').textContent = `LBL ${labelFiles.length}`;
  labelDrop.querySelector('span').textContent = objNames ? 'OBJ.NAMES' : 'LOADED';
  checkReady();
}

function checkReady() {
  runBtn.disabled = !(imageFiles.length && labelFiles.length);
}

function readClassInput() {
  classes = document.getElementById('classInput').value.split(/\r?\n|,/).map(s => s.trim()).filter(Boolean);
  classes.forEach((name, idx) => {
    if (!classColors[name]) classColors[name] = DEFAULT_COLORS[idx % DEFAULT_COLORS.length];
  });
  visibleClasses = classFilter === '__all__' ? new Set(classes) : new Set([classFilter]);
  renderMissingClassOptions();
}

function runValidation() {
  readClassInput();
  records = [];
  issueMap.clear();
  reviewedSet.clear();
  reviewQueue = [];
  reviewPos = -1;
  imageMap = new Map();
  labelMap = new Map();
  activeBoxIndex = -1;
  mainImageCache = new Map();
  thumbBitmapCache = new Map();
  showLoading('MATCHING');

  for (const file of imageFiles) {
    const key = normalizedStem(file.name);
    if (!imageMap.has(key)) imageMap.set(key, []);
    imageMap.get(key).push(file);
  }
  for (const file of labelFiles) {
    const key = normalizedStem(file.name);
    if (!labelMap.has(key)) labelMap.set(key, []);
    labelMap.get(key).push(file);
  }

  const allKeys = new Set([...imageMap.keys(), ...labelMap.keys()]);
  const sortedKeys = Array.from(allKeys).sort((a, b) => a.localeCompare(b, 'ko', { numeric: true, sensitivity: 'base' }));

  for (const key of sortedKeys) {
    const images = imageMap.get(key) || [];
    const labels = labelMap.get(key) || [];
    const status = images.length && labels.length ? 'matched' : images.length ? 'missing-label' : 'missing-image';
    records.push({
      id: key,
      baseName: (images[0] || labels[0]).name.replace(/\.[^/.]+$/, ''),
      imageFile: images[0] || null,
      labelFile: labels[0] || null,
      allImageFiles: images,
      allLabelFiles: labels,
      duplicateImages: Math.max(0, images.length - 1),
      duplicateLabels: Math.max(0, labels.length - 1),
      status,
      boxes: [],
      labelVariants: null,
      parseError: '',
      imageSize: null
    });
  }

  document.getElementById('loadingText').textContent = `PARSE 0/${records.length}`;
  let parsed = 0;
  Promise.all(records.map(r => parseRecord(r).then(() => {
    parsed++;
    if (parsed % 25 === 0 || parsed === records.length) {
      document.getElementById('loadingText').textContent = `PARSE ${parsed}/${records.length}`;
    }
  }))).then(() => {
    // Stable review order (#1, #2, ...) assigned once over the reviewable set
    // (matched + has boxes) in filename order — doesn't shift when the user
    // later filters/searches, so it can be used to find where a paused
    // review session left off.
    let orderCounter = 0;
    records.forEach(r => {
      r.order = (r.status === 'matched' && r.boxes.length > 0 && !isDuplicate(r)) ? ++orderCounter : null;
    });
    reviewableTotal = orderCounter;

    renderClassControls();
    renderStats();
    renderGallery();
    const matchedIdx = records.findIndex(r => r.status === 'matched' && r.boxes.length > 0 && !isDuplicate(r));
    if (matchedIdx >= 0) {
      selectRecord(matchedIdx);
    } else {
      currentIndex = -1;
      updateGalleryHighlights();
      updatePosCounter();
      renderCurrent();
    }
    document.getElementById('csvBtn').disabled = false;
    document.getElementById('jsonBtn').disabled = false;
    document.getElementById('statusText').textContent = 'READY';
    hideLoading();
  });
}

function showLoading(text) {
  document.getElementById('loadingText').textContent = text;
  document.getElementById('loadingOverlay').classList.remove('hidden');
}

function hideLoading() {
  document.getElementById('loadingOverlay').classList.add('hidden');
}

function isDuplicate(record) {
  return record.duplicateImages > 0 || record.duplicateLabels > 0;
}

// Immediate parent folder name, used to tell duplicate copies of the same
// filename apart (e.g. two "IMG_1234.txt" living under different category
// folders) without assuming any particular folder-naming convention.
function fileSourceTag(file) {
  const path = filePath(file);
  const parts = path.split(/[\\/]/);
  return parts.length > 1 ? parts[parts.length - 2] : path;
}

// Best-effort pairing of a label variant with "its" image copy: prefer the
// image living under the same immediate folder, fall back to the first
// image if the folder layout doesn't line up 1:1.
function findImageForSource(record, source) {
  return record.allImageFiles.find(f => fileSourceTag(f) === source) || record.imageFile;
}

let currentCompareRecord = null;

async function openCompareView(record) {
  currentCompareRecord = record;
  const variants = record.labelVariants || [];
  document.getElementById('compareTitle').textContent = `DUP — ${record.baseName}`;
  const grid = document.getElementById('compareGrid');
  grid.innerHTML = '';
  document.getElementById('compareModal').classList.remove('hidden');
  loadCompareIssueForm(record);

  for (const variant of variants) {
    const panel = document.createElement('div');
    panel.className = 'compare-panel';
    panel.innerHTML = `<canvas></canvas><div class="compare-caption">${escapeHtml(variant.source)} — ${variant.boxCount} BOX</div>`;
    grid.appendChild(panel);
    const canvas = panel.querySelector('canvas');
    const imageFile = findImageForSource(record, variant.source);
    if (!imageFile) continue;
    const img = await loadImage(imageFile);
    const scale = Math.min(1, 900 / img.naturalWidth);
    const w = Math.max(1, Math.round(img.naturalWidth * scale));
    const h = Math.max(1, Math.round(img.naturalHeight * scale));
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);
    drawBoxes(ctx, { boxes: variant.boxes }, w, h, img.naturalWidth, img.naturalHeight, true);
  }
}

function closeCompareView() {
  document.getElementById('compareModal').classList.add('hidden');
  currentCompareRecord = null;
}

function buildCompareIssueChecks() {
  const wrap = document.getElementById('compareIssueChecks');
  wrap.innerHTML = '';
  ISSUE_TYPES.forEach(([value, label]) => {
    const item = document.createElement('label');
    item.className = 'check';
    item.innerHTML = `<input type="checkbox" value="${value}" onchange="updateCompareIssue()"> ${label}`;
    wrap.appendChild(item);
  });
}
buildCompareIssueChecks();

function loadCompareIssueForm(record) {
  const issue = issueMap.get(record.id);
  document.querySelectorAll('#compareIssueChecks input').forEach(input => input.checked = issue?.types?.includes(input.value) || false);
  document.getElementById('compareMissingClassSelect').value = issue?.missingClass || '';
  document.getElementById('compareNoteInput').value = issue?.note || '';
}

function updateCompareIssue() {
  const record = currentCompareRecord;
  if (!record) return;
  const types = Array.from(document.querySelectorAll('#compareIssueChecks input:checked')).map(i => i.value);
  const missingClass = document.getElementById('compareMissingClassSelect').value;
  const note = document.getElementById('compareNoteInput').value.trim();
  if (!types.length && !missingClass && !note) issueMap.delete(record.id);
  else issueMap.set(record.id, { id: record.id, file: record.baseName, types, missingClass, note, boxCount: record.boxes.length, status: record.status });
  saveReviewResult(record, actionFromIssue(issueMap.get(record.id)), issueMap.get(record.id) || null);
  renderStats();
  renderIssuesList();
  updateGalleryHighlights();
}

function markCompareOk() {
  const record = currentCompareRecord;
  if (!record) return;
  issueMap.delete(record.id);
  reviewedSet.add(record.id);
  saveReviewResult(record, 'approved');
  loadCompareIssueForm(record);
  renderStats();
  renderIssuesList();
  updateGalleryHighlights();
}

function clearCompareIssue() {
  const record = currentCompareRecord;
  if (!record) return;
  issueMap.delete(record.id);
  reviewedSet.delete(record.id);
  saveReviewResult(record, 'cleared');
  loadCompareIssueForm(record);
  renderStats();
  renderIssuesList();
  updateGalleryHighlights();
}

// Shared YOLO-line parser used both for a record's primary label file and,
// for duplicate-filename records, every other candidate label file so their
// full box sets (not just counts) are available for the compare view.
async function parseBoxesFromFile(file) {
  const text = await file.text();
  const lines = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  const boxes = [];
  let parseError = '';
  for (let i = 0; i < lines.length; i++) {
    const parts = lines[i].split(/\s+/);
    if (parts.length !== 5) {
      parseError = `LABEL ${i + 1} FORMAT`;
      continue;
    }
    const [cidRaw, xcRaw, ycRaw, wRaw, hRaw] = parts;
    const classId = Number(cidRaw);
    const xc = Number(xcRaw), yc = Number(ycRaw), bw = Number(wRaw), bh = Number(hRaw);
    if (![classId, xc, yc, bw, bh].every(Number.isFinite)) {
      parseError = `LABEL ${i + 1} NUMBER`;
      continue;
    }
    const className = classes[classId] || String(classId);
    boxes.push({ classId, className, xc, yc, bw, bh, row: i + 1 });
    if (!classColors[className]) classColors[className] = DEFAULT_COLORS[classId % DEFAULT_COLORS.length];
    visibleClasses.add(className);
  }
  return { boxes, parseError };
}

async function parseRecord(record) {
  if (record.duplicateLabels > 0) {
    record.labelVariants = await Promise.all(record.allLabelFiles.map(async f => {
      const { boxes } = await parseBoxesFromFile(f);
      return { source: fileSourceTag(f), boxCount: boxes.length, boxes, file: f };
    }));
  }
  if (!record.labelFile) return;
  const { boxes, parseError } = await parseBoxesFromFile(record.labelFile);
  record.boxes = boxes;
  if (parseError) record.parseError = parseError;
}

function renderStats() {
  const matched = records.filter(r => r.status === 'matched').length;
  const zero = records.filter(r => r.status === 'matched' && r.boxes.length === 0 && !isDuplicate(r)).length;
  const duplicate = records.filter(r => r.status === 'matched' && isDuplicate(r)).length;
  const boxes = records.reduce((sum, r) => sum + r.boxes.length, 0);
  const reviewed = records.filter(r => r.status === 'matched' && (reviewedSet.has(r.id) || issueMap.has(r.id))).length;
  document.getElementById('statImages').textContent = imageFiles.length;
  document.getElementById('statLabels').textContent = labelFiles.length;
  document.getElementById('statMatched').textContent = matched;
  document.getElementById('statZero').textContent = zero;
  document.getElementById('statDuplicate').textContent = duplicate;
  document.getElementById('statBoxes').textContent = boxes;
  document.getElementById('statIssues').textContent = issueMap.size;
  document.getElementById('statReviewed').textContent = reviewed;
  document.getElementById('statProgress').textContent = matched ? `${Math.round(reviewed / matched * 100)}%` : '0%';
}

function isReviewed(record) {
  return reviewedSet.has(record.id) || issueMap.has(record.id);
}

function renderClassControls() {
  const all = Array.from(new Set(classes));
  records.forEach(r => r.boxes.forEach(b => all.includes(b.className) || all.push(b.className)));
  all.forEach((name, idx) => {
    if (!classColors[name]) classColors[name] = DEFAULT_COLORS[idx % DEFAULT_COLORS.length];
  });
  if (classFilter !== '__all__' && !all.includes(classFilter)) classFilter = '__all__';

  const row = document.getElementById('classChipRow');
  row.innerHTML = '';
  row.appendChild(buildClassChip('__all__', 'ALL'));
  all.forEach(name => row.appendChild(buildClassChip(name, name, classColors[name])));

  renderMissingClassOptions();
}

function buildClassChip(value, label, color) {
  const chip = document.createElement('button');
  chip.type = 'button';
  chip.className = `class-chip ${classFilter === value ? 'active' : ''}`;
  chip.innerHTML = color ? `<span class="chip-swatch" style="background:${color}"></span>${escapeHtml(label)}` : escapeHtml(label);
  chip.addEventListener('click', () => setClassFilter(value));
  return chip;
}

function renderMissingClassOptions() {
  ['missingClassSelect', 'compareMissingClassSelect'].forEach(id => {
    const select = document.getElementById(id);
    select.innerHTML = '<option value="">NONE</option>';
    classes.forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      select.appendChild(opt);
    });
  });
}

function setClassFilter(value) {
  classFilter = value;
  visibleClasses = value === '__all__' ? new Set(classes) : new Set([value]);
  renderClassControls();
  renderGallery();
  renderCurrent();
}

// The gallery is split into three mutually exclusive buckets so that files
// with an unresolved filename collision (duplicate) or with no box data
// (zero) never silently show up mixed into the normal "전체"/class-filtered
// view — they only appear when their own filter tab is selected.
function filteredRecords() {
  const q = document.getElementById('searchInput').value.trim().normalize('NFC').toLowerCase();
  const f = document.getElementById('filterSelect').value;
  return records.filter(r => {
    if (r.status !== 'matched') return false;
    const dup = isDuplicate(r);
    if (f === 'duplicate') {
      if (!dup) return false;
    } else if (f === 'zero') {
      if (dup || r.boxes.length !== 0) return false;
    } else {
      if (dup || r.boxes.length === 0) return false;
      if (f === 'issue' && !issueMap.has(r.id)) return false;
      if (f === 'unreviewed' && isReviewed(r)) return false;
    }
    if (q && !r.baseName.normalize('NFC').toLowerCase().includes(q)) return false;
    if (classFilter !== '__all__' && !r.boxes.some(b => b.className === classFilter)) return false;
    return true;
  }).slice(0, PAGE_LIMIT);
}

function thumbClassName(record) {
  const dup = record.isVariant || isDuplicate(record);
  const dupOrZero = dup ? 'dup' : (record.boxes.length === 0 ? 'zero-box' : '');
  // A variant card's issue/review state belongs to its parent duplicate
  // group's id, not the variant's own synthetic id.
  const checkId = record.isVariant ? record.parentRecord.id : record.id;
  return `thumb ${record.id === records[currentIndex]?.id ? 'active' : ''} ${issueMap.has(checkId) ? 'issue' : (isReviewed({ id: checkId }) ? 'reviewed' : '')} ${dupOrZero}`;
}

function thumbOrderLabel(record) {
  if (record.isVariant) return record.variantSource;
  if (record.order) return `#${record.order}`;
  if (isDuplicate(record)) return 'DUP';
  if (record.status === 'matched' && record.boxes.length === 0) return 'ZERO';
  return '-';
}

// Full rebuild: only call when the *set/order* of visible thumbnails changes
// (search, filter, or data reload). Thumbnails are decoded lazily as they
// scroll into view instead of all-at-once, which is what made the gallery
// feel slow with large datasets.
// In the "중복 파일명" filter, every duplicate copy (one per conflicting
// label file) gets its own thumbnail card instead of collapsing the whole
// group into a single card — so all versions are visible side by side in
// the grid itself, not hidden behind a click.
function duplicateVariantRows() {
  const q = document.getElementById('searchInput').value.trim().normalize('NFC').toLowerCase();
  const rows = [];
  records.forEach(r => {
    if (r.status !== 'matched' || !isDuplicate(r)) return;
    if (q && !r.baseName.normalize('NFC').toLowerCase().includes(q)) return;
    (r.labelVariants || []).forEach((variant, i) => {
      rows.push({
        id: `${r.id}__v${i}`,
        baseName: r.baseName,
        imageFile: findImageForSource(r, variant.source),
        boxes: variant.boxes,
        status: 'matched',
        order: null,
        isVariant: true,
        variantSource: variant.source,
        parentRecord: r
      });
    });
  });
  return rows.slice(0, PAGE_LIMIT);
}

function renderGallery() {
  const gallery = document.getElementById('gallery');
  gallery.innerHTML = '';
  galleryThumbMap.clear();
  if (galleryObserver) galleryObserver.disconnect();

  const isDuplicateView = document.getElementById('filterSelect').value === 'duplicate';
  const rows = isDuplicateView ? duplicateVariantRows() : filteredRecords();
  if (!rows.length) {
    gallery.innerHTML = '<div class="gallery-empty">EMPTY</div>';
    return;
  }

  galleryObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const canvas = entry.target;
      const entryInfo = galleryThumbMap.get(canvas.dataset.recordId);
      if (entryInfo && !canvas.dataset.rendered) {
        canvas.dataset.rendered = '1';
        drawThumbCanvas(entryInfo.record, canvas);
      }
      galleryObserver.unobserve(canvas);
    });
  }, { root: document.getElementById('gallery').closest('.gallery-wrap'), rootMargin: '600px 0px' });

  rows.forEach(record => {
    const card = document.createElement('div');
    card.className = thumbClassName(record);
    card.innerHTML = `
      <div class="thumb-order">${thumbOrderLabel(record)}</div>
      <canvas></canvas>
      <div class="thumb-foot">
        <div class="thumb-name" title="${escapeHtml(record.baseName)}">${escapeHtml(record.baseName)}</div>
        <div class="thumb-meta"><span>${statusLabel(record)}</span><span>${record.boxes.length} boxes</span></div>
      </div>
    `;
    const canvas = card.querySelector('canvas');
    canvas.dataset.recordId = record.id;
    card.addEventListener('click', () => {
      if (record.isVariant) {
        openCompareView(record.parentRecord);
        return;
      }
      reviewQueue = filteredRecords();
      reviewPos = reviewQueue.indexOf(record);
      selectRecord(records.indexOf(record));
      enterReviewMode();
    });
    gallery.appendChild(card);
    galleryThumbMap.set(record.id, { card, canvas, record });
    galleryObserver.observe(canvas);
  });
}

// Cheap update after selecting a record / marking an issue: just toggle the
// active/issue/reviewed border classes on already-built thumb cards, no
// re-decode of any image.
function updateGalleryHighlights() {
  galleryThumbMap.forEach(({ card, record }) => {
    card.className = thumbClassName(record);
  });
}

// Re-draw only thumbnails that have already been decoded once (bitmap is
// cached, so this is cheap) after a view-mode or class-visibility change.
function redrawVisibleThumbs() {
  galleryThumbMap.forEach(({ canvas, record }) => {
    if (canvas.dataset.rendered) drawThumbCanvas(record, canvas);
  });
}

async function drawThumbCanvas(record, canvas) {
  const ctx = canvas.getContext('2d');
  if (!record.imageFile) {
    canvas.width = 360;
    canvas.height = Math.round(360 * 0.62);
    ctx.fillStyle = '#2c2a3d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ffffff';
    ctx.font = '18px sans-serif';
    ctx.fillText('NO IMAGE', 18, 34);
    return;
  }
  const bitmap = await loadThumbBitmap(record.imageFile);
  if (!bitmap) return;
  const w = bitmap.width, h = bitmap.height;
  canvas.width = w;
  canvas.height = h;
  ctx.drawImage(bitmap, 0, 0, w, h);
  drawBoxes(ctx, record, w, h, record.imageSize?.width || w, record.imageSize?.height || h, false);
}

// Downscaled, decoded-once thumbnail bitmap per file. createImageBitmap with
// resize options decodes directly at thumbnail resolution instead of
// decoding the full-resolution image and scaling it down on every draw.
function loadThumbBitmap(file) {
  if (thumbBitmapCache.has(file)) return thumbBitmapCache.get(file);
  const promise = (async () => {
    if (window.createImageBitmap) {
      try {
        const full = await createImageBitmap(file);
        const scale = Math.min(1, 360 / full.width);
        const w = Math.max(1, Math.round(full.width * scale));
        const h = Math.max(1, Math.round(full.height * scale));
        const resized = await createImageBitmap(full, { resizeWidth: w, resizeHeight: h, resizeQuality: 'medium' });
        full.close();
        return resized;
      } catch (e) {
        // fall through to <img> based decoding below
      }
    }
    // Fallback for browsers without createImageBitmap: decode via <img>, then
    // bake a small offscreen canvas so we still hand back a thumbnail-sized
    // drawable instead of a full-resolution image.
    const img = await loadImage(file);
    const scale = Math.min(1, 360 / img.naturalWidth);
    const w = Math.max(1, Math.round(img.naturalWidth * scale));
    const h = Math.max(1, Math.round(img.naturalHeight * scale));
    const off = document.createElement('canvas');
    off.width = w;
    off.height = h;
    off.getContext('2d').drawImage(img, 0, 0, w, h);
    return off;
  })();
  thumbBitmapCache.set(file, promise);
  return promise;
}

function selectRecord(index) {
  if (index < 0 || index >= records.length) return;
  currentIndex = index;
  activeBoxIndex = -1;
  loadIssueToForm();
  updateGalleryHighlights();
  updatePosCounter();
  renderCurrent();
  prefetchNeighbors(index);
}

function updatePosCounter() {
  const counter = document.getElementById('posCounter');
  const record = records[currentIndex];
  if (record && reviewQueue.length && reviewPos >= 0) {
    counter.textContent = `${reviewPos + 1} / ${reviewQueue.length}`;
  } else if (record) {
    counter.textContent = `${currentIndex + 1} / ${records.length}`;
  } else {
    counter.textContent = '';
  }
  document.getElementById('navPrevBtn').disabled = !hasPrevItem();
  document.getElementById('navNextBtn').disabled = !hasNextItem();
}

function ensureReviewQueue() {
  if (!reviewQueue.length) {
    reviewQueue = filteredRecords();
    reviewPos = reviewQueue.indexOf(records[currentIndex]);
  }
}

function hasPrevItem() {
  ensureReviewQueue();
  return reviewPos > 0;
}

function hasNextItem() {
  ensureReviewQueue();
  return reviewPos >= 0 && reviewPos < reviewQueue.length - 1;
}

function prevItem() {
  ensureReviewQueue();
  if (reviewPos > 0) {
    reviewPos--;
    selectRecord(records.indexOf(reviewQueue[reviewPos]));
  }
}

function nextItem() {
  ensureReviewQueue();
  if (reviewPos >= 0 && reviewPos < reviewQueue.length - 1) {
    reviewPos++;
    selectRecord(records.indexOf(reviewQueue[reviewPos]));
  }
}

function prefetchNeighbors(index) {
  ensureReviewQueue();
  [reviewPos - 1, reviewPos + 1].forEach(p => {
    const record = reviewQueue[p];
    if (record && record.imageFile) loadImage(record.imageFile).catch(() => {});
  });
}

function enterReviewMode() {
  document.getElementById('viewerPanel').classList.add('viewer-fullscreen');
    document.getElementById('fullscreenToggleBtn').textContent = 'CLOSE';
  document.body.style.overflow = 'hidden';
}

function exitReviewMode() {
  const panel = document.getElementById('viewerPanel');
  if (!panel.classList.contains('viewer-fullscreen')) return;
  panel.classList.remove('viewer-fullscreen');
    document.getElementById('fullscreenToggleBtn').textContent = 'FOCUS';
  document.body.style.overflow = '';
}

function toggleReviewMode() {
  if (document.getElementById('viewerPanel').classList.contains('viewer-fullscreen')) exitReviewMode();
  else {
    ensureReviewQueue();
    enterReviewMode();
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeCompareView(); exitReviewMode(); return; }
  const tag = document.activeElement ? document.activeElement.tagName : '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if (e.key === 'ArrowRight') { e.preventDefault(); nextItem(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prevItem(); }
});

async function renderCurrent() {
  const record = records[currentIndex];
  const canvas = document.getElementById('mainCanvas');
  const boxList = document.getElementById('boxList');
  if (!record) {
    canvas.width = 1; canvas.height = 1;
    boxList.innerHTML = '';
    document.getElementById('metaTable').innerHTML = '<div class="meta-row"><div class="meta-key">FILE</div><div class="meta-val">EMPTY</div></div>';
    return;
  }
  await renderCanvas(canvas, record, 1200, true);
  magnifierImg = record.imageFile ? await loadImage(record.imageFile) : null;
  renderMeta(record);
  boxList.innerHTML = record.boxes.length ? '' : '<div class="hint">NO BOX</div>';
  const firstByClass = new Set();
  record.boxes.forEach((box, idx) => {
    const row = document.createElement('div');
    row.className = 'box-row';
    row.title = `${idx + 1}. ${box.className}`;
    const showClass = !firstByClass.has(box.className);
    firstByClass.add(box.className);
    row.innerHTML = `<span class="swatch" style="background:${classColors[box.className] || '#a8a4bd'}"></span><span>${idx + 1}${showClass ? `. <span class="box-class-once">${escapeHtml(box.className)}</span>` : ''}</span><button>SEL</button>`;
    row.querySelector('button').addEventListener('click', () => {
      activeBoxIndex = idx;
      renderCurrent();
    });
    boxList.appendChild(row);
  });
}

async function renderCanvas(canvas, record, maxWidth, isMain = false) {
  const ctx = canvas.getContext('2d');
  if (!record.imageFile) {
    canvas.width = maxWidth;
    canvas.height = Math.round(maxWidth * 0.62);
    ctx.fillStyle = '#2c2a3d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ffffff';
    ctx.font = '18px sans-serif';
    ctx.fillText('NO IMAGE', 18, 34);
    return;
  }
  const img = await loadImage(record.imageFile);
  record.imageSize = { width: img.naturalWidth, height: img.naturalHeight };
  const scale = Math.min(1, maxWidth / img.naturalWidth);
  const w = Math.max(1, Math.round(img.naturalWidth * scale));
  const h = Math.max(1, Math.round(img.naturalHeight * scale));
  canvas.width = w;
  canvas.height = h;

  ctx.drawImage(img, 0, 0, w, h);
  if (!isMain || mainViewMode === 'overlay') {
    drawBoxes(ctx, record, w, h, img.naturalWidth, img.naturalHeight, isMain);
  }
}

function toggleMainViewMode() {
  mainViewMode = mainViewMode === 'overlay' ? 'image' : 'overlay';
  updateMainViewToggleBtn();
  renderCurrent();
}

function updateMainViewToggleBtn() {
  const btn = document.getElementById('mainViewToggleBtn');
  btn.textContent = mainViewMode === 'overlay' ? 'IMAGE' : 'OVERLAY';
  btn.classList.toggle('active', mainViewMode === 'image');
}

function drawBoxes(ctx, record, canvasW, canvasH, imgW, imgH, isMain) {
  ctx.save();
  const scaleX = canvasW / imgW;
  const scaleY = canvasH / imgH;
  const labeledClasses = new Set();
  record.boxes.forEach((box, idx) => {
    if (!visibleClasses.has(box.className)) return;
    const color = classColors[box.className] || '#a8a4bd';
    const x = (box.xc - box.bw / 2) * imgW * scaleX;
    const y = (box.yc - box.bh / 2) * imgH * scaleY;
    const bw = box.bw * imgW * scaleX;
    const bh = box.bh * imgH * scaleY;
    ctx.globalAlpha = isMain ? 0.08 : 0.14;
    ctx.fillStyle = color;
    ctx.fillRect(x, y, bw, bh);
    ctx.globalAlpha = 1;
    ctx.shadowColor = color;
    ctx.shadowBlur = idx === activeBoxIndex ? 14 : 8;
    ctx.lineWidth = isMain ? (idx === activeBoxIndex ? 2 : 1) : (idx === activeBoxIndex ? 3 : 1);
    ctx.strokeStyle = idx === activeBoxIndex ? '#ffffff' : color;
    ctx.strokeRect(x, y, bw, bh);
    ctx.shadowBlur = 0;
    const shouldLabel = !labeledClasses.has(box.className);
    if (shouldLabel && (isMain || canvasW > 300)) {
      labeledClasses.add(box.className);
      const label = `${idx + 1} ${box.className}`;
      ctx.font = `${Math.max(10, Math.round(canvasW / 72))}px "Courier New", monospace`;
      const tw = ctx.measureText(label).width;
      const th = Math.max(14, Math.round(canvasW / 58));
      ctx.fillStyle = color;
      ctx.fillRect(x, Math.max(0, y - th), tw + 10, th);
      ctx.fillStyle = '#050505';
      ctx.fillText(label, x + 5, Math.max(12, y - 5));
    }
  });
  ctx.restore();
}

const MAGNIFIER_SIZE = 220;
const MAGNIFIER_ZOOM = 1.5;

function initMagnifier() {
  const canvas = document.getElementById('mainCanvas');
  const lens = document.getElementById('magnifier');
  canvas.addEventListener('mouseenter', () => {
    if (magnifierImg) lens.classList.remove('hidden');
  });
  canvas.addEventListener('mousemove', (e) => {
    if (magnifierImg) drawMagnifier(e.clientX, e.clientY);
  });
  canvas.addEventListener('mouseleave', () => lens.classList.add('hidden'));
}

function drawMagnifier(clientX, clientY) {
  const canvas = document.getElementById('mainCanvas');
  const record = records[currentIndex];
  if (!record || !magnifierImg) return;
  const rect = canvas.getBoundingClientRect();
  const dispX = clientX - rect.left;
  const dispY = clientY - rect.top;
  if (dispX < 0 || dispY < 0 || dispX > rect.width || dispY > rect.height) {
    document.getElementById('magnifier').classList.add('hidden');
    return;
  }

  const imgW = magnifierImg.naturalWidth, imgH = magnifierImg.naturalHeight;
  const origX = (dispX / rect.width) * imgW;
  const origY = (dispY / rect.height) * imgH;
  const cropW = Math.min(imgW, MAGNIFIER_SIZE / MAGNIFIER_ZOOM);
  const cropH = Math.min(imgH, MAGNIFIER_SIZE / MAGNIFIER_ZOOM);
  const sx = Math.max(0, Math.min(origX - cropW / 2, imgW - cropW));
  const sy = Math.max(0, Math.min(origY - cropH / 2, imgH - cropH));

  const lensCanvas = document.getElementById('magnifierCanvas');
  lensCanvas.width = MAGNIFIER_SIZE;
  lensCanvas.height = MAGNIFIER_SIZE;
  const ctx = lensCanvas.getContext('2d');
  ctx.clearRect(0, 0, MAGNIFIER_SIZE, MAGNIFIER_SIZE);
  ctx.drawImage(magnifierImg, sx, sy, cropW, cropH, 0, 0, MAGNIFIER_SIZE, MAGNIFIER_SIZE);
  if (mainViewMode === 'overlay') {
    drawLensBoxes(ctx, record, sx, sy, cropW, cropH, imgW, imgH);
  }

  // Centered directly above the cursor (with a small gap) so it's easy to
  // read without hunting for it elsewhere on screen; flips below the cursor
  // near the top edge, and clamps horizontally so it never runs offscreen.
  const lens = document.getElementById('magnifier');
  const gap = 14;
  let left = clientX - MAGNIFIER_SIZE / 2;
  left = Math.max(8, Math.min(left, window.innerWidth - MAGNIFIER_SIZE - 8));
  let top = clientY - MAGNIFIER_SIZE - gap;
  if (top < 8) top = clientY + gap;
  lens.style.left = `${left}px`;
  lens.style.top = `${top}px`;
  lens.classList.remove('hidden');
}

function drawLensBoxes(ctx, record, sx, sy, cropW, cropH, imgW, imgH) {
  ctx.save();
  const scaleX = MAGNIFIER_SIZE / cropW;
  const scaleY = MAGNIFIER_SIZE / cropH;
  record.boxes.forEach((box, idx) => {
    if (!visibleClasses.has(box.className)) return;
    const color = classColors[box.className] || '#a8a4bd';
    const x = ((box.xc - box.bw / 2) * imgW - sx) * scaleX;
    const y = ((box.yc - box.bh / 2) * imgH - sy) * scaleY;
    const w = box.bw * imgW * scaleX;
    const h = box.bh * imgH * scaleY;
    ctx.shadowColor = color;
    ctx.shadowBlur = idx === activeBoxIndex ? 12 : 7;
    ctx.lineWidth = idx === activeBoxIndex ? 2 : 1;
    ctx.strokeStyle = idx === activeBoxIndex ? '#ffffff' : color;
    ctx.strokeRect(x, y, w, h);
    ctx.shadowBlur = 0;
  });
  ctx.restore();
}
initMagnifier();

function renderMeta(record) {
  const rows = [
    ['NO', record.order ? `${record.order} / ${reviewableTotal}` : '-'],
    ['FILE', record.baseName],
    ['STATUS', statusLabel(record)],
    ['LABEL', record.labelFile ? filePath(record.labelFile) : 'MISSING'],
    ['IMAGE', record.imageFile ? filePath(record.imageFile) : 'MISSING'],
    ['SIZE', record.imageSize ? `${record.imageSize.width} x ${record.imageSize.height}` : '-'],
    ['BOX', String(record.boxes.length)],
    ['PARSE', record.parseError || 'OK']
  ].map(([k, v]) => `<div class="meta-row"><div class="meta-key">${k}</div><div class="meta-val">${escapeHtml(v)}</div></div>`).join('');

  let dupRow = '';
  if (isDuplicate(record)) {
    const parts = [];
    if (record.duplicateImages > 0) parts.push(`IMG DUP ${record.duplicateImages + 1}`);
    if (record.labelVariants) {
      const variantText = record.labelVariants.map(v => `${escapeHtml(v.source)}: ${v.boxCount} BOX`).join('<br>');
      parts.push(variantText);
    }
    dupRow = `<div class="meta-row"><div class="meta-key">DUP</div><div class="meta-val">${parts.join('<br>')}</div></div>`;
  }

  document.getElementById('metaTable').innerHTML = rows + dupRow;
}

function buildIssueChecks() {
  const wrap = document.getElementById('issueChecks');
  wrap.innerHTML = '';
  ISSUE_TYPES.forEach(([value, label]) => {
    const item = document.createElement('label');
    item.className = 'check';
    item.innerHTML = `<input type="checkbox" value="${value}" onchange="updateCurrentIssue()"> ${label}`;
    wrap.appendChild(item);
  });
}
buildIssueChecks();

function loadIssueToForm() {
  const record = records[currentIndex];
  const issue = record ? issueMap.get(record.id) : null;
  document.querySelectorAll('#issueChecks input').forEach(input => input.checked = issue?.types?.includes(input.value) || false);
  document.getElementById('missingClassSelect').value = issue?.missingClass || '';
  document.getElementById('noteInput').value = issue?.note || '';
}

function updateCurrentIssue() {
  const record = records[currentIndex];
  if (!record) return;
  const types = Array.from(document.querySelectorAll('#issueChecks input:checked')).map(i => i.value);
  const missingClass = document.getElementById('missingClassSelect').value;
  const note = document.getElementById('noteInput').value.trim();
  if (!types.length && !missingClass && !note) issueMap.delete(record.id);
  else issueMap.set(record.id, { id: record.id, file: record.baseName, types, missingClass, note, boxCount: record.boxes.length, status: record.status });
  renderStats();
  renderIssuesList();
  updateGalleryHighlights();
}

function markOk() {
  const record = records[currentIndex];
  if (!record) return;
  issueMap.delete(record.id);
  reviewedSet.add(record.id);
  saveReviewResult(record, 'approved');
  loadIssueToForm();
  renderStats();
  renderIssuesList();
  updateGalleryHighlights();
}

function clearCurrentIssue() {
  const record = records[currentIndex];
  if (!record) return;
  issueMap.delete(record.id);
  reviewedSet.delete(record.id);
  saveReviewResult(record, 'cleared');
  loadIssueToForm();
  renderStats();
  renderIssuesList();
  updateGalleryHighlights();
}

function renderIssuesList() {
  const list = document.getElementById('issuesList');
  const rows = Array.from(issueMap.values());
  if (!rows.length) {
    list.innerHTML = '<div class="hint">NO ISSUE</div>';
    return;
  }
  list.innerHTML = rows.map(issue => `
    <div class="issue-row">
      <strong>${escapeHtml(issue.file)}</strong>
      <span>${escapeHtml(issue.types.join(', ') || '-')} ${issue.missingClass ? ' / MISSING: ' + escapeHtml(issue.missingClass) : ''}</span>
      ${issue.note ? `<span>${escapeHtml(issue.note)}</span>` : ''}
    </div>
  `).join('');
}
renderIssuesList();

// Only images that actually carry label data are worth a row in the QC
// export \u2014 matching what the gallery shows. missing-image/missing-label/
// zero-box counts are still surfaced as summary numbers (see exportJson)
// instead of drowning the useful rows in thousands of source-photo noise.
function reviewableRecords() {
  return records.filter(r => r.status === 'matched' && r.boxes.length > 0 && !isDuplicate(r));
}

// ---------------------------------------------------------------------
// Minimal, dependency-free .xlsx writer. An xlsx is a ZIP archive of OOXML
// parts; we only need a handful of them, and by storing entries uncompressed
// (ZIP "store" method) we can skip implementing DEFLATE entirely while still
// producing a file real Excel/Numbers/Sheets opens correctly with multiple
// named sheets/tabs.
// ---------------------------------------------------------------------

function xlsxColumnName(index) {
  let s = '';
  let n = index + 1;
  while (n > 0) {
    const rem = (n - 1) % 26;
    s = String.fromCharCode(65 + rem) + s;
    n = Math.floor((n - 1) / 26);
  }
  return s;
}

function xmlEscape(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[ch]));
}

function buildSheetXml(rows) {
  const rowsXml = rows.map((row, ri) => {
    const cells = row.map((val, ci) => {
      const ref = xlsxColumnName(ci) + (ri + 1);
      if (typeof val === 'number' && Number.isFinite(val)) {
        return `<c r="${ref}"><v>${val}</v></c>`;
      }
      return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlEscape(val)}</t></is></c>`;
    }).join('');
    return `<row r="${ri + 1}">${cells}</row>`;
  }).join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${rowsXml}</sheetData></worksheet>`;
}

function buildWorkbookXml(sheetNames) {
  const sheetsXml = sheetNames.map((name, i) => `<sheet name="${xmlEscape(name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheetsXml}</sheets></workbook>`;
}

function buildWorkbookRelsXml(sheetNames) {
  const rels = sheetNames.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${rels}</Relationships>`;
}

function buildContentTypesXml(sheetNames) {
  const overrides = sheetNames.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${overrides}</Types>`;
}

const XLSX_ROOT_RELS_XML = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';

const CRC32_TABLE = (() => {
  const table = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    table[n] = c >>> 0;
  }
  return table;
})();

function crc32(bytes) {
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) crc = CRC32_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

// Builds an uncompressed (store-method) ZIP from [{name, data: Uint8Array}].
function buildZip(files) {
  const localParts = [];
  const centralParts = [];
  let offset = 0;

  files.forEach(file => {
    const nameBytes = new TextEncoder().encode(file.name);
    const data = file.data;
    const crc = crc32(data);
    const size = data.length;

    const localHeader = new Uint8Array(30 + nameBytes.length);
    const lv = new DataView(localHeader.buffer);
    lv.setUint32(0, 0x04034b50, true);
    lv.setUint16(4, 20, true);
    lv.setUint16(6, 0, true);
    lv.setUint16(8, 0, true);
    lv.setUint16(10, 0, true);
    lv.setUint16(12, 0, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, size, true);
    lv.setUint32(22, size, true);
    lv.setUint16(26, nameBytes.length, true);
    lv.setUint16(28, 0, true);
    localHeader.set(nameBytes, 30);
    localParts.push(localHeader, data);

    const centralHeader = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(centralHeader.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, 0, true);
    cv.setUint16(14, 0, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, size, true);
    cv.setUint32(24, size, true);
    cv.setUint16(28, nameBytes.length, true);
    cv.setUint16(30, 0, true);
    cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true);
    cv.setUint16(36, 0, true);
    cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    centralHeader.set(nameBytes, 46);
    centralParts.push(centralHeader);

    offset += localHeader.length + data.length;
  });

  const centralSize = centralParts.reduce((s, p) => s + p.length, 0);
  const centralOffset = offset;

  const end = new Uint8Array(22);
  const ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(4, 0, true);
  ev.setUint16(6, 0, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, centralSize, true);
  ev.setUint32(16, centralOffset, true);
  ev.setUint16(20, 0, true);

  return new Blob([...localParts, ...centralParts, end], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

// sheets: [{ name, rows: [[cell, ...], ...] }]
function downloadXlsx(sheets, filename) {
  const encoder = new TextEncoder();
  const sheetNames = sheets.map(s => s.name);
  const files = [
    { name: '[Content_Types].xml', data: encoder.encode(buildContentTypesXml(sheetNames)) },
    { name: '_rels/.rels', data: encoder.encode(XLSX_ROOT_RELS_XML) },
    { name: 'xl/workbook.xml', data: encoder.encode(buildWorkbookXml(sheetNames)) },
    { name: 'xl/_rels/workbook.xml.rels', data: encoder.encode(buildWorkbookRelsXml(sheetNames)) },
    ...sheets.map((s, i) => ({ name: `xl/worksheets/sheet${i + 1}.xml`, data: encoder.encode(buildSheetXml(s.rows)) }))
  ];
  const blob = buildZip(files);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function exportCsv() {
  const mainHeader = ['order', 'file', 'box_count', 'reviewed', 'issue_types', 'missing_class', 'note'];
  const mainRows = [mainHeader];
  reviewableRecords().forEach(record => {
    const issue = issueMap.get(record.id) || {};
    mainRows.push([
      record.order,
      record.baseName,
      record.boxes.length,
      isReviewed(record) ? 'yes' : 'no',
      (issue.types || []).join('|'),
      issue.missingClass || '',
      issue.note || ''
    ]);
  });

  const dupHeader = ['file', 'variants', 'reviewed', 'issue_types', 'missing_class', 'note'];
  const dupRows = [dupHeader];
  records.filter(r => r.status === 'matched' && isDuplicate(r)).forEach(record => {
    const issue = issueMap.get(record.id) || {};
    const variants = (record.labelVariants || []).map(v => `${v.source}:${v.boxCount}\ubc15\uc2a4`).join(' | ');
    dupRows.push([
      record.baseName,
      variants,
      isReviewed(record) ? 'yes' : 'no',
      (issue.types || []).join('|'),
      issue.missingClass || '',
      issue.note || ''
    ]);
  });

  downloadXlsx([
    { name: '\uac80\uc218\uacb0\uacfc', rows: mainRows },
    { name: '\uc911\ubcf5\ud30c\uc77c\uba85', rows: dupRows }
  ], 'joseon_bbox_qc_result.xlsx');
}

function exportJson() {
  const reviewable = reviewableRecords();
  const payload = {
    exportedAt: new Date().toISOString(),
    summary: {
      images: imageFiles.length,
      labels: labelFiles.length,
      matched: records.filter(r => r.status === 'matched').length,
      reviewable: reviewable.length,
      zeroBox: records.filter(r => r.status === 'matched' && r.boxes.length === 0 && !isDuplicate(r)).length,
      duplicateFilenames: records.filter(r => r.status === 'matched' && isDuplicate(r)).length,
      boxes: records.reduce((sum, r) => sum + r.boxes.length, 0),
      issues: issueMap.size,
      reviewed: reviewable.filter(isReviewed).length
    },
    records: reviewable.map(r => ({
      order: r.order,
      file: r.baseName,
      boxCount: r.boxes.length,
      reviewed: isReviewed(r),
      ...(issueMap.get(r.id) || {})
    })),
    unreviewedFiles: reviewable.filter(r => !isReviewed(r)).map(r => r.baseName),
    zeroBoxFiles: records.filter(r => r.status === 'matched' && r.boxes.length === 0 && !isDuplicate(r)).map(r => r.baseName),
    duplicateFiles: records.filter(r => r.status === 'matched' && isDuplicate(r)).map(r => ({
      file: r.baseName,
      duplicateImages: r.duplicateImages,
      duplicateLabels: r.duplicateLabels,
      labelVariants: r.labelVariants
    })),
    missingImages: records.filter(r => r.status === 'missing-image').map(r => r.baseName),
    missingLabels: records.filter(r => r.status === 'missing-label').map(r => r.baseName)
  };
  downloadBlob(JSON.stringify(payload, null, 2), 'joseon_bbox_qc_result.json', 'application/json;charset=utf-8');
}

function downloadBlob(content, name, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  a.click();
  URL.revokeObjectURL(url);
}

function loadImage(file) {
  if (mainImageCache.has(file)) return mainImageCache.get(file);
  const promise = new Promise((resolve, reject) => {
    if (!objectUrlCache.has(file)) objectUrlCache.set(file, URL.createObjectURL(file));
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = objectUrlCache.get(file);
  });
  mainImageCache.set(file, promise);
  return promise;
}

function statusLabel(record) {
  if (record.status === 'missing-image') return 'NO IMG';
  if (record.status === 'missing-label') return 'NO LBL';
  if (record.duplicateImages || record.duplicateLabels) return 'DUP';
  if (record.parseError) return 'LBL ERR';
  return 'MATCH';
}

function resetAll() {
  exitReviewMode();
  closeCompareView();
  classFilter = '__all__';
  reviewableTotal = 0;
  mainViewMode = 'overlay';
  magnifierImg = null;
  updateMainViewToggleBtn();
  objectUrlCache.forEach(url => URL.revokeObjectURL(url));
  objectUrlCache.clear();
  if (galleryObserver) galleryObserver.disconnect();
  galleryThumbMap.clear();
  mainImageCache = new Map();
  thumbBitmapCache = new Map();
  reviewQueue = [];
  reviewPos = -1;
  imageFiles = [];
  labelFiles = [];
  records = [];
  currentIndex = -1;
  issueMap.clear();
  reviewedSet.clear();
  imageInput.value = '';
  labelInput.value = '';
  imageDrop.classList.remove('loaded');
  labelDrop.classList.remove('loaded');
  imageDrop.querySelector('strong').textContent = 'SELECT IMAGE';
  imageDrop.querySelector('span').textContent = 'JPG / JPEG / PNG';
  labelDrop.querySelector('strong').textContent = 'SELECT LABEL';
  labelDrop.querySelector('span').textContent = 'YOLO TXT';
  runBtn.disabled = true;
  document.getElementById('csvBtn').disabled = true;
  document.getElementById('jsonBtn').disabled = true;
  document.getElementById('gallery').innerHTML = '';
  document.getElementById('boxList').innerHTML = '';
  document.getElementById('mainCanvas').width = 1;
  document.getElementById('mainCanvas').height = 1;
  document.getElementById('posCounter').textContent = '';
  document.getElementById('statusText').textContent = 'IMAGE / LABEL';
  updateClassSummary();
  renderStats();
  renderIssuesList();
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

readClassInput();
renderClassControls();
renderMissingClassOptions();
updateClassSummary();
