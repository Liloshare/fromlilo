<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>업무자동화 툴</title>
  <style>
    :root {
      --bg: #050505;
      --text: #f3f0e8;
      --muted: #9a968c;
      --line: #2a2926;
      --soft: #12110f;
      --accent: #f3f0e8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Courier New", Courier, "SFMono-Regular", Consolas, monospace;
    }

    main {
      width: min(760px, calc(100% - 40px));
      margin: 0 auto;
      padding: 88px 0 72px;
    }

    header {
      margin-bottom: 44px;
    }

    h1 {
      margin: 0;
      font-size: 52px;
      line-height: 1.08;
      letter-spacing: 0;
      font-weight: 400;
    }

    .subtitle {
      max-width: 660px;
      margin: 22px 0 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.75;
    }

    .divider {
      height: 1px;
      background: var(--line);
      margin: 0 0 34px;
    }

    .tool-list {
      display: grid;
      gap: 0;
    }

    .tool-link {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 22px;
      align-items: center;
      padding: 24px 0;
      border-bottom: 1px solid var(--line);
      color: inherit;
      text-decoration: none;
    }

    .tool-link:hover .tool-title {
      color: #ffffff;
    }

    .tool-kicker {
      color: var(--muted);
      font-size: 14px;
      font-weight: 400;
      margin-bottom: 10px;
    }

    .tool-title {
      margin: 0;
      font-size: 24px;
      line-height: 1.35;
      font-weight: 400;
    }

    .tool-desc {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .open-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 0;
      background: var(--soft);
      color: var(--text);
      font-size: 14px;
      font-weight: 400;
      white-space: nowrap;
    }

    .tool-link:hover .open-button {
      border-color: #5a5750;
      background: #1a1815;
    }

    @media (max-width: 560px) {
      main { width: min(100% - 30px, 760px); padding-top: 56px; }
      h1 { font-size: 38px; }
      .subtitle { font-size: 16px; }
      .tool-link { grid-template-columns: 1fr; gap: 12px; }
      .open-button { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>업무자동화 툴</h1>
        <p class="subtitle">반복 검수, 파일 확인, 납품 전 점검을 조금 더 빠르고 일관되게 처리하기 위한 도구들을 모아둔 공간입니다.</p>
      </div>
    </header>

    <div class="divider"></div>

    <section class="tool-list" aria-label="자동화 도구 목록">
      <a class="tool-link" href="./tools/joseon-bbox-qc/">
        <div>
          <div class="tool-kicker">Bounding Box QC</div>
          <h2 class="tool-title">조선 BBox QC Tool</h2>
          <p class="tool-desc">원본 이미지 폴더와 YOLO 라벨 폴더를 비교해 매칭, 박스 수, 중복 파일명, 오류 메모를 검수합니다.</p>
        </div>
        <span class="open-button">열기</span>
      </a>
    </section>
  </main>
</body>
</html>
